[package]
name = "bdinfo-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# INDEPENDENT workspace — keeps libfuzzer-sys (which uses `unsafe`) and the
# nightly/Linux fuzz tooling OUT of the main workspace's gate and out of the
# `forbid(unsafe_code)` posture of crates/bdinfo-rs{-core,}. The root Cargo.toml
# also `exclude`s this directory.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bdinfo-rs-core = { path = "../crates/bdinfo-rs-core" }
# The browser package's own entry points. `run_report` / `run_iso_report` and
# the `mirror::Disc` model are not `cfg(target_arch = "wasm32")`-gated, so a
# native build reaches them; the six `#[wasm_bindgen]` exports around them are
# browser-only and stay out of reach here.
bdinfo-rs-wasm = { path = "../crates/bdinfo-rs-wasm" }
# The native stand-in for the browser deserializer that hands `render_report` a
# caller-supplied `Disc` — the same role `serde_json` plays in that crate's own
# wire-format tests.
serde_json = "1"
# The desktop app's configuration reader. Only `settings` is fuzzed, but cargo
# builds every dependency of this package for every target in it, so the crate's
# iced/wgpu tree is compiled once per fuzz build — measured 2026-08-03 at +36 s
# on a warm registry, against 14 s for the rest of the workspace.
bdinfo-rs-gui = { path = "../crates/bdinfo-rs-gui" }

[profile.release]
debug = 1

[[bin]]
name = "read_be"
path = "fuzz_targets/read_be.rs"
test = false
doc = false
bench = false

