name: audit

# The CRON leg of the supply-chain audit — the VOLATILE half of the wgpu-style
# cargo-deny split: RustSec advisories (vulns / unsound / unmaintained /
# yanked) float with the advisory database, so a CVE disclosed between pushes
# must surface on a schedule, not ride an unrelated PR. Daily, for the root
# workspace AND the GUI crate's independent workspace (its iced/wgpu tree is
# invisible to the root check; the wasm tree gets the same daily coverage from
# sweep.yml running wasm.yml's own deny).
#
# The DETERMINISTIC half (bans — incl. the no-C-dependencies guard behind the
# static binary — licenses, sources) plus cargo-vet moved to core.yml as
# plan-gated jobs on the `deps` area: those are pure functions of the
# committed manifests/lockfile, so a red there is always caused by the change
# under test; the daily sweep re-verifies them ungated. dependency-review
# still catches advisories a PR's own dependency changes would introduce.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: cargo deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `fallback: none`: install only from install-action's checksummed manifest,
      # never its runtime-resolved cargo-binstall fallback (rationale in core.yml).
      - name: Install cargo-deny (prebuilt, no from-source compile)
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-deny
          fallback: none

      - name: Audit advisories (root workspace)
        run: cargo deny check advisories

      # The GUI crate's OWN dependency tree (iced / wgpu / winit — an excluded
      # independent workspace, invisible to the root check above), against the
      # crate-local crates/bdinfo-rs-gui/deny.toml. Duplicates gui.yml's
      # per-run step ON PURPOSE: this daily cron is what surfaces a RUSTSEC
      # advisory published between pushes.
      - name: Audit advisories (GUI crate's dependency tree)
        run: cargo deny --manifest-path crates/bdinfo-rs-gui/Cargo.toml check advisories
