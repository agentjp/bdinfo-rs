name: scorecard

# OpenSSF Scorecard — automated supply-chain / security-posture scoring
# (branch protection, signed releases, pinned dependencies, token permissions,
# …). Publishing the results feeds the public Scorecard badge and uploads a
# SARIF report into code scanning. Free on public repositories.

on:
  # Re-score when branch protection changes (Scorecard reads those settings).
  branch_protection_rule:
  # Daily only — deliberately NOT on push: a push-triggered scan races the
  # still-running CodeQL on the just-merged commit and reports it as an
  # unchecked SAST commit (a transient that the daily scan, run after CodeQL
  # settles, never sees).
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC

# Least privilege at the top; the analysis job widens only what it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish results to the OpenSSF API
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: results.sarif
