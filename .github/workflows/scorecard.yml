name: scorecard

# OpenSSF Scorecard — automated supply-chain / security-posture scoring
# (branch protection, signed releases, pinned dependencies, token permissions,
# …). Publishing the results feeds the public Scorecard badge and uploads a
# SARIF report into code scanning. Free on public repositories.

on:
  # Re-score when branch protection changes (Scorecard reads those settings).
  branch_protection_rule:
  # Daily only — deliberately NOT on push: a push-triggered scan races the
  # still-running CodeQL on the just-merged commit and reports it as an
  # unchecked SAST commit (a transient that the daily scan, run after CodeQL
  # settles, never sees).
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC

# Least privilege at the top; the analysis job widens only what it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish results to the OpenSSF API
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
