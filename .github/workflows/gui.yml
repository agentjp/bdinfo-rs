name: gui

# The PROPORTIONATE Posture-C gate for the native desktop GUI
# (crates/bdinfo-rs-gui), mirrored 1:1 by the local scripts/gui-compliance.ps1.
# Tier A — the crate's LIBRARY (flow / model / selection / panes / progress /
# paths / clipboard / columns / settings / theme / icon / scan) — is held to the
# core bar: clippy -D warnings, llvm-cov 100% lines/regions/functions,
# cargo-mutants 0 missed, proptests, byte-exact golden ties. Tier B (the iced
# shell main.rs + the style vocabulary ui.rs) is excluded from cov/mutants by
# the crate-local .cargo/mutants.toml (proofs there) and verified instead by
# the iced_test Simulator interaction suite, the tiny-skia snapshot hashes, and
# the headless launch smoke below.
#
# Job shape — the repo's standing pattern (same reasoning as the core/CLI in
# ci.yml): arch bugs live in build + test, which runs on all six shipped
# arches; coverage/mutants measure test quality of platform-independent logic,
# so once (ubuntu) is the signal. The snapshot-hash ties run per-arch as an
# initially-ADVISORY step (mismatches upload the rendered PNGs as artifacts,
# the step does not fail — yet): pure-CPU tiny-skia rendering with bundled
# fonts is byte-identical across OSes in iced's own CI, but this repo promotes
# the hashes to a hard per-arch gate only after its own 6-arch PR runs prove
# that holds here too. The text-report goldens stay HARD everywhere —
# byte-exactness lives on the report, not the pixels.
#
# REQUIRED-CHECK CONTEXTS (added to branch protection at merge time, NOT now —
# the additive-POST procedure is in CLAUDE.md; contexts match the job `name:`
# strings verbatim, so renaming a job silently un-gates it):
#   gui build + test (ubuntu-latest)
#   gui build + test (ubuntu-24.04-arm)
#   gui build + test (windows-2025)
#   gui build + test (windows-11-arm)
#   gui build + test (macos-15-intel)
#   gui build + test (macos-15)
#   gui checks (lint + coverage + mutants + deny)
#   gui msrv (rust 1.96)
#   gui smoke (ubuntu-latest)
#   gui smoke (windows-2025)
# The macOS smoke stays soft (continue-on-error): the runner's paravirtual
# Metal is the one render path with no software fallback, and a required check
# that flakes blocks every PR.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIGHTLY: nightly-2026-07-06 # keep in lockstep with scripts/_common.ps1 + ci.yml (cross-checked by version-freshness.yml)
  # Every iced_test renderer (interaction, snapshots, and the same tests under
  # coverage/mutants) must be the deterministic tiny-skia software backend —
  # never a GPU whose pixels vary by driver. Also what makes the suites run on
  # GPU-less runners at all.
  ICED_TEST_BACKEND: tiny-skia

jobs:
  # Build + the full test suite on every shipped arch — where per-platform bugs
  # actually live. The snapshot ties run as a separate advisory step (above).
  test:
    name: gui build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-nextest

      - name: Clippy (calibrated, -D warnings)
        working-directory: crates/bdinfo-rs-gui
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --locked

      - name: Test (unit + proptests + golden ties + iced_test interactions)
        working-directory: crates/bdinfo-rs-gui
        run: cargo nextest run --locked --no-tests=fail -E 'not test(/^snapshots::/)'

      # The SHIPPED configuration — opt-level="s" + fat LTO + codegen-units=1 +
      # strip + (Windows) windows_subsystem — compiles on every shipped arch.
      # wgpu has LTO-breakage history; without this a green merge can hide a
      # red first release. Build-only: the smoke env hooks are debug-only, so a
      # release binary cannot auto-exit — launching it stays a human step.
      - name: Build (release profile — the shipped configuration)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --release --locked

      # One release-mode test leg: debug_assertions off and the optimizer at
      # the shipped level over the full suite (every cfg(debug_assertions)
      # site lives in the Tier-B bin, but overflow-checks and codegen differ
      # crate-wide in release). Once is the signal — per-arch bugs are the
      # debug matrix's job. Snapshots stay excluded: the advisory/hard split
      # is decided on the debug matrix, not here.
      - name: Test (release mode)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/bdinfo-rs-gui
        run: cargo nextest run --release --locked --no-tests=fail -E 'not test(/^snapshots::/)'

      # ADVISORY (for now): the tiny-skia snapshot ties against the committed
      # hashes. Byte-identity across all six arches is expected (iced's own CI
      # pins one hash across ubuntu/windows/macos) but unproven here — promote
      # this step to blocking once the 6-arch PR runs hold; the local gate
      # already runs it blocking on one host.
      - name: Snapshot hashes (tiny-skia — ADVISORY per-arch)
        id: snapshots
        continue-on-error: true
        working-directory: crates/bdinfo-rs-gui
        run: cargo nextest run --locked --no-tests=fail -E 'test(/^snapshots::/)'

      - name: Upload mismatched snapshot renders
        if: steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-snapshot-mismatch-${{ matrix.os }}
          path: crates/bdinfo-rs-gui/target/snapshot-failures/
          if-no-files-found: ignore

  # The once-is-the-signal tier: the tripwires and lints, the crate-local
  # supply-chain audit, Tier-A coverage at the 100% floor, and Tier-A mutation
  # at 0 missed — platform-independent measurements, run on one runner.
  checks:
    name: gui checks (lint + coverage + mutants + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned nightly rustfmt + llvm-tools (for llvm-cov)
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt --component llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui

      - name: Install the Rust gate tools (llvm-cov / nextest / mutants / machete / shear / deny / typos)
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-mutants,cargo-machete,cargo-shear,cargo-deny,typos-cli

      # The no-C tripwire (cargo tree over the 6 shipped targets: GTK/C bans,
      # the -sys/-dl allowlist, verified-inert cc/pkg-config wrappers, and the
      # positive ashpd/xdg-portal assert on Linux) + the forbid(unsafe_code)
      # assertion — the single-source script the local gate runs too.
      - name: GUI tripwires (no-C + forbid(unsafe_code))
        shell: pwsh
        run: .github/scripts/gui-rules.ps1

      - name: Format (nightly rustfmt)
        working-directory: crates/bdinfo-rs-gui
        run: cargo "+$NIGHTLY" fmt --check

      - name: Typos
        working-directory: crates/bdinfo-rs-gui
        run: typos

      - name: Machete (unused deps)
        working-directory: crates/bdinfo-rs-gui
        run: cargo machete

      - name: Shear (unused deps, AST)
        working-directory: crates/bdinfo-rs-gui
        run: cargo shear

      # Supply-chain audit of the GUI crate's OWN dependency tree (iced / wgpu /
      # winit / cosmic-text — compiled into the shipped binary but invisible to
      # the root audit, which `exclude`s this independent workspace). Uses the
      # crate-local crates/bdinfo-rs-gui/deny.toml; deliberately deny-only — no
      # cargo-vet for this leaf (the wasm precedent). Run from the repo root so
      # the manifest path resolves.
      - name: cargo-deny (gui dep audit — advisories / licenses / bans / sources)
        run: cargo deny --manifest-path crates/bdinfo-rs-gui/Cargo.toml check

      - name: Doc (warnings = errors)
        working-directory: crates/bdinfo-rs-gui
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked

      # Tier-A coverage at the 100% floor. main.rs + ui.rs are Tier B (the iced
      # shell and the style vocabulary, verified by the interaction suite +
      # snapshot hashes + the smoke below) and excluded from the denominator —
      # the same shape as the wasm gate, whose cfg'd-out Tier B never enters
      # its native build. Branch coverage is deliberately not enforced
      # (Posture C, like B).
      - name: Coverage (llvm-cov nextest — Tier A 100% lines/regions/functions)
        working-directory: crates/bdinfo-rs-gui
        shell: pwsh
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'gui-cov.json'
          cargo "+$env:NIGHTLY" llvm-cov nextest --locked --no-tests=fail --json --output-path $json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @((Get-Content -Raw $json | ConvertFrom-Json).data[0].files |
              Where-Object { $_.filename -match 'bdinfo-rs-gui[\\/]src[\\/]' -and
                  $_.filename -notmatch '[\\/]src[\\/](main|ui)\.rs$' })
          if (-not $files.Count) { Write-Host 'no Tier-A src files in the coverage report'; exit 1 }
          $fail = @()
          foreach ($m in 'lines', 'regions', 'functions') {
            $covered = (@($files | ForEach-Object { $_.summary.$m.covered }) | Measure-Object -Sum).Sum
            $count = (@($files | ForEach-Object { $_.summary.$m.count }) | Measure-Object -Sum).Sum
            $pct = if ($count) { 100.0 * $covered / $count } else { 100.0 }
            Write-Host ("{0,-10}{1,7:N2}%  ({2}/{3})" -f $m, $pct, $covered, $count)
            if ($covered -lt $count) { $fail += "$m $covered/$count" }
          }
          if ($fail.Count) { Write-Host "coverage below 100%: $($fail -join ', ')"; exit 1 }

      # Tier-A mutation, 0 missed. --in-place because the temp copy would not
      # carry the ../bdinfo-rs-core path dep (the same reason the wasm gate
      # uses it); reads the crate-local .cargo/mutants.toml Tier-B exclusions.
      - name: Mutants (Tier A 0 missed)
        working-directory: crates/bdinfo-rs-gui
        run: cargo mutants --in-place

  # The declared MSRV is enforced, not decorative: build with exactly the
  # rust-version toolchain from Cargo.toml (1.96 — also the root workspace's,
  # which the bdinfo-rs-core path dep inherits). Build-only by design:
  # rust-version is a claim about building the package, not about the
  # dev-dependency tree (iced_test may float its own MSRV). Drift self-detects:
  # a rust-version bump past this toolchain makes cargo refuse the build here
  # until the two move in lockstep.
  msrv:
    name: gui msrv (rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.96 --profile minimal

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui

      - name: Build with the declared rust-version
        working-directory: crates/bdinfo-rs-gui
        run: cargo +1.96 build --locked

  # The real-window launch smoke: the app opens, renders, and exits 0, driven
  # by the debug-only BDINFO_GUI_SMOKE_MS/BDINFO_GUI_OPEN env hooks over the
  # committed fixture disc. Proven recipes: xvfb + Mesa's lavapipe software
  # Vulkan on Linux, the in-box DX12 WARP software rasterizer on Windows
  # (Bevy's CI runs real winit+wgpu windows with both). macOS runs the same
  # smoke soft (continue-on-error): its paravirtual Metal has no software
  # fallback, and a required check that flakes blocks every PR.
  smoke:
    name: gui smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui

      - name: Install the virtual display + software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libxkbcommon-x11-0

      - name: Build (debug — the env hooks are debug-only)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --locked

      - name: Launch smoke (xvfb + lavapipe)
        if: runner.os == 'Linux'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
        run: xvfb-run -a cargo run --locked

      - name: Launch smoke (DX12 WARP)
        if: runner.os == 'Windows'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
          WGPU_BACKEND: dx12
        run: cargo run --locked

      - name: Launch smoke (paravirtual Metal — SOFT)
        if: runner.os == 'macOS'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
        run: cargo run --locked
