name: gui

# The PROPORTIONATE Posture-C gate for the native desktop GUI
# (crates/bdinfo-rs-gui), mirrored 1:1 by the local scripts/gui-compliance.ps1.
# A workflow_call REUSABLE: ci.yml invokes it when its plan job fires the `gui`
# area (a crate-dir change, a core change via the encoded path-dep edge —
# root-Cargo.lock-only bumps excluded — or an edit to this file / the
# .github/scripts/gui-*.ps1 helpers, since a gate's implementation files
# re-fire the gate), and the daily sweep re-runs it ungated through the same
# orchestrator. This file carries no triggers or concurrency
# of its own — both are the caller's — so it can never fire on its own and
# never needs a paths filter.
#
# Tier A — the crate's LIBRARY (flow / model / selection / panes / progress /
# paths / clipboard / columns / settings / theme / icon / winres / scan) — is held to the
# core bar: clippy -D warnings, llvm-cov 100% lines/regions/functions,
# cargo-mutants 0 missed, proptests, byte-exact golden ties. Tier B (the iced
# shell main.rs + the style vocabulary ui.rs) is excluded from cov/mutants by
# the crate-local .cargo/mutants.toml (proofs there) and verified instead by
# the iced_test Simulator interaction suite, the tiny-skia snapshot hashes, the
# headless launch smoke, and the real-window drive walks below.
#
# The full-crate mutation bar is NOT enforced here: it lives in sweep.yml,
# sharded, running daily — only when the crate tree changed since the last
# green sweep — and on release tags, the authoritative 0-missed checkpoints. The PR path gets the
# advisory in-diff mutants job in ci.yml (`gui mutation testing (PR diff)`)
# instead.
#
# Job shape — the repo's standing pattern (same reasoning as the core/CLI in
# core.yml): arch bugs live in build + test, which runs on all six shipped
# arches; coverage measures test quality of platform-independent logic, so
# once (ubuntu) is the signal. The snapshot-hash ties are a hard per-arch
# gate: the first 6-arch runs proved tiny-skia renders byte-identically per OS
# family, pinned in snapshots/{windows,unix}/. The text-report goldens stay
# HARD everywhere — byte-exactness lives on the report, not the pixels.
#
# Check contexts: these jobs render as `gui / gui build + test (…)` etc. and
# were never individually required; they gate merges through ci.yml's `ci-ok`
# fan-in (a red here reddens ci-ok). The staged plan to add 10 gui contexts to
# branch protection at merge time is superseded by the ci-ok swap.

on:
  workflow_call:

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-07-06 # keep in lockstep with scripts/_common.ps1 + core.yml (cross-checked by version-freshness.yml)
  # Every iced_test renderer (interaction, snapshots, and the same tests under
  # coverage/mutants) must be the deterministic tiny-skia software backend —
  # never a GPU whose pixels vary by driver. Also what makes the suites run on
  # GPU-less runners at all.
  ICED_TEST_BACKEND: tiny-skia
  # Keep the cached target/ small: no incremental-compilation metadata, and
  # line tables instead of full DWARF (still enough for file:line in a test
  # backtrace). A called workflow inherits none of its caller's env, so these
  # are declared here as well as in ci.yml — which carries the rationale.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Build + the full test suite on every shipped arch — where per-platform bugs
  # actually live. The snapshot ties run as their own BLOCKING per-arch step
  # below (excluded from the plain test step so their verdict reports alone).
  test:
    name: gui build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          # Cache write-discipline (wgpu): PR-branch saves are invisible to
          # every other PR, so only master runs (pushes + the daily sweep)
          # save; PRs restore the master-seeded cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # `fallback: none` on every install-action step here: install only from the
      # action's checksummed manifest, never its runtime-resolved cargo-binstall
      # fallback (rationale in core.yml).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-nextest
          fallback: none

      - name: Clippy (calibrated, -D warnings)
        working-directory: crates/bdinfo-rs-gui
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --locked

      - name: Test (unit + proptests + golden ties + iced_test interactions)
        working-directory: crates/bdinfo-rs-gui
        run: cargo nextest run --locked --no-tests=fail -E 'not test(/^snapshots::/)'

      # The SHIPPED configuration — opt-level="s" + fat LTO + codegen-units=1 +
      # strip + (Windows) windows_subsystem — compiles on every shipped arch.
      # wgpu has LTO-breakage history; without this a green merge can hide a
      # red first release.
      - name: Build (release profile — the shipped configuration)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --release --locked

      # The one thing a release binary can do unattended: `--version` prints
      # and exits 0 before any window machinery loads (src/args.rs) — the
      # probe packaging validators run, and the GUI analogue of the
      # `bdinfo-rs --version` assertion in install-smoke-test.yml. A window
      # launch still needs the debug-only smoke env hooks below: a bare
      # release launch opens a real window and stays up until a human closes
      # it. Start-Process + WaitForExit because a windows_subsystem=windows
      # binary detaches from the console — a plain invocation on the Windows
      # legs would neither wait nor see the exit code; the 30 s cap turns a
      # regression back into a window launch into a fast red instead of a
      # job-timeout hang.
      - name: Version probe (the release binary exits 0)
        working-directory: crates/bdinfo-rs-gui
        shell: pwsh
        run: |
          $exe = './target/release/bdinfo-rs-gui' + ($IsWindows ? '.exe' : '')
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru
          if (-not $p.WaitForExit(30000)) {
            $p.Kill()
            throw '--version did not exit within 30 s'
          }
          if ($p.ExitCode -ne 0) { throw "--version exited $($p.ExitCode)" }

      # Every PR run yields downloadable per-arch release binaries — including
      # the arches this project has no hardware for — so any increment can be
      # hand-tested on real machines without any release machinery. Short
      # retention: these are throwaway smoke builds, not distribution.
      - name: Upload the release binary (short-retention artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdinfo-rs-gui-${{ matrix.os }}
          path: |
            crates/bdinfo-rs-gui/target/release/bdinfo-rs-gui
            crates/bdinfo-rs-gui/target/release/bdinfo-rs-gui.exe
          retention-days: 7
          if-no-files-found: error

      # One release-mode test leg: debug_assertions off and the optimizer at
      # the shipped level over the full suite (every cfg(debug_assertions)
      # site lives in the Tier-B bin, but overflow-checks and codegen differ
      # crate-wide in release). Once is the signal — per-arch bugs are the
      # debug matrix's job. Snapshots stay excluded: the per-OS-family ties
      # are the debug matrix's verdict, not this leg's.
      - name: Test (release mode)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/bdinfo-rs-gui
        run: cargo nextest run --release --locked --no-tests=fail -E 'not test(/^snapshots::/)'

      # BLOCKING per-arch: the tiny-skia snapshot ties against the committed
      # per-OS-family hashes (snapshots/{windows,unix}/ — the first 6-arch run
      # disproved one-hash-across-OSes: bold text rasterizes differently
      # between Windows and the unix family, but byte-identically across
      # arches WITHIN each family, which is exactly what this step holds).
      # This matrix is the only place non-Windows pixels are ever rendered —
      # the dev loop runs Windows only — so these ties are the sole guard
      # against style regressions on the other four arches. --no-fail-fast:
      # report every tie's verdict, not just the first mismatch.
      - name: Snapshot hashes (tiny-skia — per-OS-family pins)
        id: snapshots
        working-directory: crates/bdinfo-rs-gui
        run: cargo nextest run --locked --no-tests=fail --no-fail-fast -E 'test(/^snapshots::/)'

      - name: Upload mismatched snapshot renders
        if: failure() && steps.snapshots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-snapshot-mismatch-${{ matrix.os }}
          path: crates/bdinfo-rs-gui/target/snapshot-failures/
          if-no-files-found: ignore

  # The once-is-the-signal tier: the tripwires and lints, the crate-local
  # supply-chain audit, and Tier-A coverage at the 100% floor —
  # platform-independent measurements, run on one runner. (Tier-A mutation
  # moved to sweep.yml + the release-tag leg; see the header.)
  checks:
    name: gui checks (lint + coverage + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly rustfmt + llvm-tools (for llvm-cov)
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt --component llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install the Rust gate tools (llvm-cov / nextest / machete / shear / deny / typos)
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-shear,cargo-deny,typos-cli
          fallback: none

      # The no-C tripwire (cargo tree over the 6 shipped targets: GTK/C bans,
      # the -sys/-dl allowlist, verified-inert cc/pkg-config wrappers, and the
      # positive ashpd/xdg-portal assert on Linux) + the forbid(unsafe_code)
      # assertion — the single-source script the local gate runs too.
      - name: GUI tripwires (no-C + forbid(unsafe_code))
        shell: pwsh
        run: .github/scripts/gui-rules.ps1

      - name: Format (nightly rustfmt)
        working-directory: crates/bdinfo-rs-gui
        run: cargo "+$NIGHTLY" fmt --check

      - name: Typos
        working-directory: crates/bdinfo-rs-gui
        run: typos

      - name: Machete (unused deps)
        working-directory: crates/bdinfo-rs-gui
        run: cargo machete

      - name: Shear (unused deps, AST)
        working-directory: crates/bdinfo-rs-gui
        run: cargo shear

      # Supply-chain audit of the GUI crate's OWN dependency tree (iced / wgpu /
      # winit / cosmic-text — compiled into the shipped binary but invisible to
      # the root audit, which `exclude`s this independent workspace). Uses the
      # crate-local crates/bdinfo-rs-gui/deny.toml; deliberately deny-only — no
      # cargo-vet for this leaf (the wasm precedent). Run from the repo root so
      # the manifest path resolves.
      - name: cargo-deny (gui dep audit — advisories / licenses / bans / sources)
        run: cargo deny --manifest-path crates/bdinfo-rs-gui/Cargo.toml check

      - name: Doc (warnings = errors)
        working-directory: crates/bdinfo-rs-gui
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked

      # Tier-A coverage at the 100% floor. main.rs + ui.rs are Tier B (the iced
      # shell and the style vocabulary, verified by the interaction suite +
      # snapshot hashes + the smoke below) and excluded from the denominator —
      # the same shape as the wasm gate, whose cfg'd-out Tier B never enters
      # its native build. Branch coverage is deliberately not enforced
      # (Posture C, like B).
      # The full suite, snapshot ties included: the per-OS-family pins hold
      # under coverage instrumentation too (verified — the instrumented
      # nightly render is byte-identical to the stable one).
      - name: Coverage (llvm-cov nextest — Tier A 100% lines/regions/functions)
        working-directory: crates/bdinfo-rs-gui
        shell: pwsh
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'gui-cov.json'
          cargo "+$env:NIGHTLY" llvm-cov nextest --locked --no-tests=fail --json --output-path $json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @((Get-Content -Raw $json | ConvertFrom-Json).data[0].files |
              Where-Object { $_.filename -match 'bdinfo-rs-gui[\\/]src[\\/]' -and
                  $_.filename -notmatch '[\\/]src[\\/](main|ui)\.rs$' })
          if (-not $files.Count) { Write-Host 'no Tier-A src files in the coverage report'; exit 1 }
          $fail = @()
          foreach ($m in 'lines', 'regions', 'functions') {
            $covered = (@($files | ForEach-Object { $_.summary.$m.covered }) | Measure-Object -Sum).Sum
            $count = (@($files | ForEach-Object { $_.summary.$m.count }) | Measure-Object -Sum).Sum
            $pct = if ($count) { 100.0 * $covered / $count } else { 100.0 }
            Write-Host ("{0,-10}{1,7:N2}%  ({2}/{3})" -f $m, $pct, $covered, $count)
            if ($covered -lt $count) { $fail += "$m $covered/$count" }
          }
          if ($fail.Count) { Write-Host "coverage below 100%: $($fail -join ', ')"; exit 1 }

  # The declared MSRV is enforced, not decorative: build with exactly the
  # rust-version toolchain from Cargo.toml, read from the manifest at run time
  # so an MSRV bump touches Cargo.toml ONLY (no version literals here to drift;
  # the version also stays out of the job `name:` — static YAML can't
  # interpolate step outputs there). Build-only by design: rust-version is a
  # claim about building the package, not about the dev-dependency tree
  # (iced_test may float its own MSRV).
  msrv:
    name: gui msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the MSRV floor from Cargo.toml
        id: msrv
        # jq -e fails loudly if rust-version ever disappears from the manifest.
        run: |
          v="$(cargo metadata --no-deps --format-version 1 --manifest-path crates/bdinfo-rs-gui/Cargo.toml | jq -er '.packages[] | select(.name == "bdinfo-rs-gui") | .rust_version')"
          echo "MSRV floor: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build with the declared rust-version
        working-directory: crates/bdinfo-rs-gui
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" build --locked

  # The packaging smoke: assemble every distribution artifact shape on its
  # native runner with the SAME .github/scripts/gui-package-*.ps1 the
  # gui-release.yml lane runs, then assert contents (zip/MSI layout + platform
  # tag, .app/dmg structure + ad-hoc signature, AppImage root entries, deb/rpm
  # payloads + weak deps, desktop-file/AppStream validation) — the PR-time
  # proof that keeps the release lane's tag-only surface thin, the same
  # pattern core.yml's pkg job uses for the CLI's .deb/.rpm. One leg per OS
  # family: the packaging logic is arch-independent (the release lane's
  # native arm legs run the identical scripts; its check script asserts the
  # arm64 MSI's platform tag there). The cargo-deb/cargo-generate-rpm pins
  # must equal .github/build-linux-packages.sh's (version-freshness.yml
  # cross-checks all three homes).
  package:
    name: gui packaging smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            triple: x86_64-unknown-linux-gnu
          - os: windows-2025
            kind: windows
            triple: x86_64-pc-windows-msvc
          - os: macos-15
            kind: macos
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          # Release-profile artifacts, distinct from the debug legs' lineages.
          shared-key: gui-package
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install the Linux packagers + validators
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream-util rpm

      # Both packagers at the exact versions the packaging script would compile
      # from source if missing — this pre-install just makes the smoke fast.
      - name: Install cargo-deb (release-pinned, prebuilt)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-deb@3.7.0
          fallback: none

      # cargo-generate-rpm is absent from taiki-e/install-action's manifest, so
      # with the binstall fallback disabled it is compiled from crates.io once and
      # cached, the lane core.yml's cargo-fuzz and cargo-vet use.
      - name: Cache the pinned cargo-generate-rpm binary
        if: runner.os == 'Linux'
        id: rpm-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-generate-rpm
          key: cargo-generate-rpm-${{ runner.os }}-0.21.0

      - name: Install cargo-generate-rpm (cache miss)
        if: runner.os == 'Linux' && steps.rpm-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-generate-rpm@0.21.0

      - name: Build (release profile)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --release --locked -p bdinfo-rs-gui

      - name: Read the crate version
        id: version
        shell: bash
        run: |
          v="$(cargo metadata --no-deps --format-version 1 --manifest-path crates/bdinfo-rs-gui/Cargo.toml | jq -er '.packages[] | select(.name == "bdinfo-rs-gui") | .version')"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Package (Linux — AppImage + deb + rpm)
        if: matrix.kind == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: pwsh .github/scripts/gui-package-linux.ps1 -Version "$VERSION" -Triple "$TRIPLE" -OutDir dist-gui

      - name: Package (Windows — zip + MSI)
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: >
          .github/scripts/gui-package-windows.ps1
          -Exe crates/bdinfo-rs-gui/target/release/bdinfo-rs-gui.exe
          -Version $env:VERSION -Triple $env:TRIPLE -OutDir dist-gui

      - name: Package (macOS — .app in a dmg)
        if: matrix.kind == 'macos'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: >
          pwsh .github/scripts/gui-package-macos.ps1
          -Binary crates/bdinfo-rs-gui/target/release/bdinfo-rs-gui
          -Version "$VERSION" -Triple "$TRIPLE" -OutDir dist-gui

      - name: Assert the artifact contents
        shell: pwsh
        env:
          KIND: ${{ matrix.kind }}
          TRIPLE: ${{ matrix.triple }}
        run: .github/scripts/gui-package-check.ps1 -Kind $env:KIND -Dir dist-gui -Triple $env:TRIPLE

      # Real install + launch of what was just packaged (MSI /qn install +
      # probe + uninstall, dpkg -i + probe + remove, AppImage
      # extract-and-run, dmg mount + probe) — the same script the
      # gui-release.yml legs run at tag time.
      - name: Install-and-launch smoke
        shell: pwsh
        env:
          KIND: ${{ matrix.kind }}
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          .github/scripts/gui-install-smoke.ps1
          -Kind $env:KIND -Dir dist-gui -Triple $env:TRIPLE -Version $env:VERSION

      - name: Upload the packaged artifacts (hand-testing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-packages-${{ matrix.os }}
          path: dist-gui/
          retention-days: 7
          if-no-files-found: error

  # The real-window launch smoke: the app opens, renders, and exits 0, driven
  # by the debug-only BDINFO_GUI_SMOKE_MS/BDINFO_GUI_OPEN env hooks over the
  # committed fixture disc. Proven recipes: xvfb + Mesa's lavapipe software
  # Vulkan on Linux, the in-box DX12 WARP software rasterizer on Windows
  # (Bevy's CI runs real winit+wgpu windows with both). All five legs are
  # HARD (the arm legs and finally macos-15 were each promoted after sustained
  # green streaks, PR #128 and its follow-up): macOS is a crucial supported
  # platform, and a gate that ignores its own signal is not a gate — a red
  # macos-15 leg now means something actually broke. Its known failure mode:
  # the runner's paravirtual Metal is the one render path with no software
  # fallback. If a leg ever flakes for environment reasons, fix the harness
  # or deliberately re-soften — never a silent retry loop.
  # macos-15-intel is deliberately ABSENT: its hosted VMs expose no Metal at
  # all, so there is no real window stack to smoke — that arch's compile/logic
  # coverage lives in `gui build + test (macos-15-intel)`. The per-OS
  # install/launch steps below key on runner.os.
  smoke:
    name: gui smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          # smoke + drive-assisted + drive-inject run the IDENTICAL plain
          # debug build per OS, so the three share ONE cache lineage instead
          # of rust-cache's default per-job keys — three byte-duplicate
          # multi-hundred-MB caches per OS family otherwise crowd the repo's
          # 10 GB Actions-cache budget and LRU-evict the sweep markers.
          shared-key: gui-drive
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install the virtual display + software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libxkbcommon-x11-0

      - name: Build (debug — the env hooks are debug-only)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --locked

      - name: Launch smoke (xvfb + lavapipe)
        if: runner.os == 'Linux'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
        run: xvfb-run -a cargo run --locked

      # The portable marker end to end, one leg: an empty file named
      # `bdinfo-rs-gui.portable` beside the executable must switch the config
      # write to `gui.conf` beside the executable and leave the per-user
      # location untouched (src/settings.rs owns the path choice and
      # unit-tests it; this asserts the built binary actually consults it).
      # The marker-less smoke above already proved the other half — a
      # successful listing persists the config to the per-user location —
      # which the first assertion reads back before clearing it.
      - name: Portable-marker smoke (config lands beside the executable)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
        run: |
          conf="${XDG_CONFIG_HOME:-$HOME/.config}/bdinfo-rs/gui.conf"
          test -f "$conf" || { echo "the marker-less smoke left no per-user config at $conf"; exit 1; }
          rm -rf "$(dirname "$conf")"
          touch target/debug/bdinfo-rs-gui.portable
          xvfb-run -a ./target/debug/bdinfo-rs-gui
          test -f target/debug/gui.conf || { echo "portable mode wrote no gui.conf beside the executable"; exit 1; }
          test ! -e "$conf" || { echo "portable mode still wrote the per-user config at $conf"; exit 1; }
          rm -f target/debug/bdinfo-rs-gui.portable target/debug/gui.conf

      - name: Launch smoke (DX12 WARP)
        if: runner.os == 'Windows'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
          WGPU_BACKEND: dx12
        run: cargo run --locked

      - name: Launch smoke (paravirtual Metal)
        if: runner.os == 'macOS'
        working-directory: crates/bdinfo-rs-gui
        env:
          BDINFO_GUI_OPEN: ../bdinfo-rs/tests/fixtures/BigBuckBunny
          BDINFO_GUI_SMOKE_MS: "8000"
        run: cargo run --locked

  # The real-window DRIVE gates: the app driven end to end on a real desktop
  # session, a screenshot per step uploaded as a gallery either way. The gui
  # release lane inherits these as part of its bar. Two complementary proofs:
  #
  #   assisted  the debug-only BDINFO_GUI_DRIVE seam walks the app through the
  #             full click-everything sequence (sort → splitter → rows →
  #             Settings → scan → cancel → rescan → report → copy → save) and
  #             the OS only screenshots each rendered state. Skips the OS
  #             input stack, but message-driven and coordinate-free — zero
  #             maintenance on layout changes. Hard asserts: the walk
  #             completed, exit 0, the saved report exists on disk.
  #   inject    real OS cursor/keyboard events (SendInput on Windows, xdotool
  #             under xvfb on Linux, cliclick on macOS) at fixed logical
  #             coordinates over the pinned 880x960 window — the truest
  #             input-path proof. Hard assert: the Settings click changes the
  #             rendered pixels. Its price is the shared coordinate table
  #             (calibrated to the 880-wide layout): a deliberate layout
  #             change must update it in the same PR, snapshot-test semantics.
  #
  # Blocking on ALL FIVE legs — Linux/Windows x86 AND arm plus macos-15, hard
  # like the smoke above: macOS is a crucial supported platform, and a gate
  # that ignores its own signal is not a gate. Known macos-15 failure modes
  # (residual risks, not reasons to soften): the paravirtual Metal path has no software
  # fallback, and drive-inject carries the Sequoia screen-capture re-approval
  # residual. If a leg ever flakes for environment reasons, fix the harness
  # (the scripts already handle window polling and capture pre-authorization)
  # or deliberately re-soften — never a silent retry loop. macos-15-intel is
  # absent for the smoke's no-Metal reason. The x86 legs ride the proven
  # display recipes (xvfb + lavapipe, DX12 WARP); every leg runs at a
  # 1920x1080 desktop with shots cropped to the 880x960 window, so the
  # galleries are comparable across OSes. Scheduled coverage comes from the
  # daily sweep, which re-runs this whole workflow ungated and files the
  # rolling issue on a scheduled red; a red leg here reddens the `gui` caller
  # job and therefore ci-ok.
  drive-assisted:
    name: gui drive assisted (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          # One lineage with smoke/drive-inject — see the smoke job's note.
          shared-key: gui-drive
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install the virtual display + software Vulkan + capture (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libxkbcommon-x11-0 imagemagick xdotool

      # displayplacer raises the mac desktop to 1920x1080 (best-effort; the
      # paravirtual display may reject a mode — the harness then works at
      # whatever it gets and crops to the window regardless).
      # The runner image ships aws/tap pre-tapped; Homebrew's tap-trust ignores
      # the untrusted tap and warns on every brew command. Untap it (brew's own
      # first remedy — we never use it) instead of trusting it or disabling
      # trust checks; both formulae come from homebrew/core.
      - name: Install displayplacer (macOS resolution control)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap
          brew install displayplacer

      - name: Build (debug — the drive seam is debug-only)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --locked

      # A 1920x1080 virtual display everywhere (the harness raises Windows/mac
      # to match); the app runs at its natural 880x960 window and every shot is
      # cropped to that window (via xdotool's window id here), so the galleries
      # are identical across OSes and carry no desktop margin.
      - name: Drive the walk (xvfb + lavapipe)
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a --server-args="-screen 0 1920x1080x24" pwsh .github/scripts/gui-drive-assisted.ps1
          -Exe crates/bdinfo-rs-gui/target/debug/bdinfo-rs-gui
          -Disc crates/bdinfo-rs/tests/fixtures/BigBuckBunny
          -Gallery gallery

      - name: Drive the walk (DX12 WARP)
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
        run: >
          pwsh .github/scripts/gui-drive-assisted.ps1
          -Exe crates/bdinfo-rs-gui/target/debug/bdinfo-rs-gui.exe
          -Disc crates/bdinfo-rs/tests/fixtures/BigBuckBunny
          -Gallery gallery

      - name: Drive the walk (paravirtual Metal)
        if: runner.os == 'macOS'
        run: >
          pwsh .github/scripts/gui-drive-assisted.ps1
          -Exe crates/bdinfo-rs-gui/target/debug/bdinfo-rs-gui
          -Disc crates/bdinfo-rs/tests/fixtures/BigBuckBunny
          -Gallery gallery

      - name: Upload the gallery (evidence either way)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-drive-assisted-${{ matrix.os }}
          path: gallery/
          retention-days: 7
          if-no-files-found: warn

  drive-inject:
    name: gui drive inject (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
          - ubuntu-24.04-arm
          - windows-11-arm
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crates/bdinfo-rs-gui
          # One lineage with smoke/drive-assisted — see the smoke job's note.
          shared-key: gui-drive
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install the virtual display + software Vulkan + xdotool + capture (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libxkbcommon-x11-0 imagemagick xdotool

      # aws/tap untapped for the assisted step's reason: unused, untrusted,
      # warns on every brew command.
      - name: Install cliclick + displayplacer (macOS clicks + resolution)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap
          brew install cliclick displayplacer

      - name: Build (debug — the env hooks are debug-only)
        working-directory: crates/bdinfo-rs-gui
        run: cargo build --locked

      # 1920x1080 virtual display, window-cropped capture — see the assisted note.
      - name: Inject the walk (xdotool under xvfb)
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a --server-args="-screen 0 1920x1080x24" pwsh .github/scripts/gui-drive-inject-linux.ps1
          -Exe crates/bdinfo-rs-gui/target/debug/bdinfo-rs-gui
          -Disc crates/bdinfo-rs/tests/fixtures/BigBuckBunny
          -Gallery gallery

      - name: Inject the walk (SendInput)
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
        run: >
          pwsh .github/scripts/gui-drive-inject-windows.ps1
          -Exe crates/bdinfo-rs-gui/target/debug/bdinfo-rs-gui.exe
          -Disc crates/bdinfo-rs/tests/fixtures/BigBuckBunny
          -Gallery gallery

      - name: Inject the walk (cliclick)
        if: runner.os == 'macOS'
        run: >
          pwsh .github/scripts/gui-drive-inject-macos.ps1
          -Exe crates/bdinfo-rs-gui/target/debug/bdinfo-rs-gui
          -Disc crates/bdinfo-rs/tests/fixtures/BigBuckBunny
          -Gallery gallery

      - name: Upload the gallery (evidence either way)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-drive-inject-${{ matrix.os }}
          path: gallery/
          retention-days: 7
          if-no-files-found: warn

  # The run's showcase artifact: every drive leg's `00-listed` shot at NATIVE
  # resolution in one labelled 2x5 image (assisted top row, inject bottom,
  # matrix column order) — all ten rendered windows at a glance without
  # opening ten gallery artifacts. Fan-in over the leg uploads; `!cancelled()`
  # so a red leg still yields the partial evidence (a missing shot renders as
  # a labelled dark tile; only zero shots fails, by which point the legs have
  # already reddened the gate). A WINDOWS runner because the composer is
  # System.Drawing (GDI+) with the true Segoe UI / Consolas faces.
  drive-mosaic:
    name: gui drive mosaic
    needs: [drive-assisted, drive-inject]
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the leg galleries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gui-drive-*
          path: shots

      - name: Compose the mosaic
        shell: pwsh
        run: .github/scripts/gui-drive-mosaic.ps1 -Root shots -Out gui-drive-mosaic.png

      - name: Upload the mosaic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-drive-mosaic
          path: gui-drive-mosaic.png
          retention-days: 7
          if-no-files-found: error
