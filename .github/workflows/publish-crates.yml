name: publish-crates

# Publish bdinfo-rs-core then bdinfo-rs to crates.io on a vX.Y.Z tag, using
# crates.io Trusted Publishing (OIDC): a short-lived, repo/workflow-scoped token is
# minted at run time and revoked afterwards, so NO long-lived CARGO_REGISTRY_TOKEN
# is stored. Publishes the two crates individually in dependency order (library
# first), checking crates.io and skipping any version already published so a re-run
# after a partial failure finishes the release instead of erroring — see the publish
# step for why `cargo publish --workspace` (one command for both) can't do this.
#
# Bootstrap: Trusted Publishing requires the crate to already exist, so the FIRST
# publish of each crate is done by hand; this workflow takes over for every tag
# afterwards. Configure the trusted publisher on crates.io for BOTH crates ->
# repository agentjp/bdinfo-rs, workflow `publish-crates.yml`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to publish a tag that is not on master — the same ancestry gate
  # v-release.yml and publish-npm.yml use, via the same reusable workflow. A vX.Y.Z
  # tag pushed onto a side branch (so it never passed CI on master) cannot ship to
  # crates.io: the publish job `needs:` this one. crates.io publishing is LIVE and
  # IRREVERSIBLE (a version can be yanked but never re-uploaded), so the off-master
  # guard matters most here — the tag==version check alone is satisfiable by any
  # crafted Cargo.toml on any branch.
  guard-ancestor:
    uses: ./.github/workflows/guard-ancestor.yml
    # No `secrets: inherit` — guard-ancestor takes no secrets (checkout + a
    # `git merge-base` ancestry check), so inheriting them is needless privilege
    # (and zizmor's secrets-inherit audit flags it).
    permissions:
      contents: read

  publish:
    name: cargo publish --workspace (crates.io)
    needs: guard-ancestor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the short-lived crates.io OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache here: this workflow runs only on a release tag and publishes
      # to crates.io, so a cache poisoned in a less-trusted context could taint a
      # published crate (zizmor cache-poisoning). cargo publish builds fresh.

      # cargo publishes whatever version is in Cargo.toml, not the tag — fail fast
      # if a tag was cut that does not match (mirrors the guard in docker.yml).
      # The version it resolves is a step output, so the publish step below reads
      # the value this step validated instead of re-deriving it.
      - name: Verify the tag matches the workspace version
        id: version
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          . ./.github/scripts/_common.ps1

          $tag = $env:GITHUB_REF_NAME
          $base = Get-ReleaseTagBase $tag
          # Both crates inherit the version from [workspace.package], so either
          # one reports it.
          $crate = Get-CrateVersion -Name 'bdinfo-rs-core'
          if ($base -ne $crate) { Stop-Leg "Tag $tag (base $base) does not match workspace version $crate" }
          "version=$crate" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Idempotent publish. crates.io versions are immutable, so re-running an
      # already-published version hard-errors ("crate version X.Y.Z is already
      # uploaded"), and `cargo publish --workspace` publishes core then the CLI in ONE
      # command — so if core published but the CLI did not on a first run (a mid-way CI
      # failure), a naive re-run dies on core's "already uploaded" and NEVER reaches
      # the CLI, stranding a half-published release. Instead publish each crate
      # individually, core before the CLI, tolerating an "already uploaded" error as
      # success — so a re-run after a partial publish finishes the CLI instead of aborting
      # on core. (`cargo publish` blocks until the crate it just published is live in the
      # index, so by the CLI's turn core is resolvable.) No registry pre-check: it would
      # only add a crates.io-API call a transient 503 could fail the job on.
      - name: Publish core then the CLI, tolerating any already on crates.io
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION

          # crates.io versions are immutable: re-publishing an existing version errors
          # cleanly with "already uploaded", which we tolerate as success. So we do NOT
          # pre-check the registry — that only added a crates.io-API dependency a transient
          # 503 could fail the whole job on, for no benefit. Just publish each crate and
          # treat "already uploaded/exists" as done.
          foreach ($crate in @('bdinfo-rs-core', 'bdinfo-rs')) {
            Write-Host "publishing $crate@$version"
            $out = cargo publish -p $crate --locked 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              if ($out -match 'already (uploaded|exists)') {
                Write-Host "$crate@$version is already on crates.io — treating as success"
              } else {
                throw "cargo publish -p $crate failed (exit $LASTEXITCODE)"
              }
            }
          }
