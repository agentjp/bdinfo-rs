name: publish-crates

# Publish bdinfo-rs-core then bdinfo-rs to crates.io on a vX.Y.Z tag, using
# crates.io Trusted Publishing (OIDC): a short-lived, repo/workflow-scoped token is
# minted at run time and revoked afterwards, so NO long-lived CARGO_REGISTRY_TOKEN
# is stored. Publishes the two crates individually in dependency order (library
# first), checking crates.io and skipping any version already published so a re-run
# after a partial failure finishes the release instead of erroring — see the publish
# step for why `cargo publish --workspace` (one command for both) can't do this.
#
# The publish job binds the `crates-io` environment, which holds NO secrets and
# exists only as a publishing gate: GitHub emits the environment in the token's
# OIDC claim and refuses the job outright on a ref the environment does not
# admit (its rules are the `master` branch and the `v*` and `gui-v*` tags). So
# the trusted publisher records repository agentjp/bdinfo-rs, workflow
# `publish-crates.yml` AND environment `crates-io` — a second lock, which the
# filename alone is not: anyone who can push a workflow could otherwise mint a
# token, while changing an environment takes repository-settings access.
# gui-publish-crates.yml binds the same environment for bdinfo-rs-gui.
#
# Bootstrap: Trusted Publishing requires the crate to already exist, so the FIRST
# publish of each crate is done by hand; this workflow takes over for every tag
# afterwards. Configure the trusted publisher on crates.io for BOTH crates ->
# repository agentjp/bdinfo-rs, workflow `publish-crates.yml`, environment
# `crates-io`.

on:
  push:
    tags: ["v*"]
  # Re-publish without re-tagging: re-pushing a tag is refused by the immutable
  # release ruleset and would re-fire v-release.yml, which errors on a release
  # that already exists. Re-running the original tag run is not equivalent —
  # that re-executes the workflow file as it stood at the TAG, not master's. The
  # publish is idempotent, so a dispatch against a fully-published version is a
  # no-op that still exercises the OIDC mint.
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to publish, e.g. v4.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to publish a tag that is not on master — the same ancestry gate
  # v-release.yml and publish-npm.yml use, via the same reusable workflow. A vX.Y.Z
  # tag pushed onto a side branch (so it never passed CI on master) cannot ship to
  # crates.io: the publish job `needs:` this one. crates.io publishing is LIVE and
  # IRREVERSIBLE (a version can be yanked but never re-uploaded), so the off-master
  # guard matters most here — the tag==version check alone is satisfiable by any
  # crafted Cargo.toml on any branch.
  guard-ancestor:
    uses: ./.github/workflows/guard-ancestor.yml
    # No `secrets: inherit` — guard-ancestor takes no secrets (checkout + a
    # `git merge-base` ancestry check), so inheriting them is needless privilege
    # (and zizmor's secrets-inherit audit flags it).
    permissions:
      contents: read

  publish:
    name: cargo publish --workspace (crates.io)
    needs: guard-ancestor
    runs-on: ubuntu-latest
    # Holds no secrets — see the header. Its deployment rules admit the v* tag
    # this runs on and the master branch a dispatch resolves to.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # mint the short-lived crates.io OIDC token
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The tag's own source: on the dispatch path `github.ref` is the default
      # branch, so the ref is taken from the input instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # No build cache here: this workflow publishes to crates.io, so a cache
      # poisoned in a less-trusted context could taint a published crate
      # (zizmor cache-poisoning). cargo publish builds fresh.

      # cargo publishes whatever version is in Cargo.toml, not the tag — fail fast
      # if a tag was cut that does not match (mirrors the guard in docker.yml).
      # The version it resolves is a step output, so the publish step below reads
      # the value this step validated instead of re-deriving it.
      - name: Verify the tag matches the workspace version
        id: version
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          . ./.github/scripts/_common.ps1

          $tag = $env:TAG
          $base = Get-ReleaseTagBase $tag
          # Both crates inherit the version from [workspace.package], so either
          # one reports it.
          $crate = Get-CrateVersion -Name 'bdinfo-rs-core'
          if ($base -ne $crate) { Stop-Leg "Tag $tag (base $base) does not match workspace version $crate" }
          "version=$crate" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Idempotent publish. `cargo publish --workspace` publishes core then the CLI in
      # ONE command — so if core published but the CLI did not on a first run (a mid-way
      # CI failure), a re-run dies on core and NEVER reaches the CLI, stranding a
      # half-published release. Instead publish each crate individually, core before the
      # CLI, treating a version already on crates.io as done — so a re-run after a
      # partial publish finishes the CLI instead of aborting on core. (`cargo publish`
      # blocks until the crate it just published is live in the index, so by the CLI's
      # turn core is resolvable.)
      - name: Publish core then the CLI, skipping any version already on crates.io
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION

          # An already-published version is SKIPPED, not overwritten: cargo resolves the
          # index first and refuses there — "error: crate <name>@<version> already exists
          # on crates.io index" — before packaging, verifying or uploading anything, so
          # the published artifact is never touched. (crates.io would reject an overwrite
          # in any case; versions are immutable.) That index read is one cargo already
          # needs, which is why this does no separate registry pre-check: a pre-check adds
          # a crates.io-API call that a transient 503 can fail the whole job on, for a
          # verdict cargo reaches anyway.
          foreach ($crate in @('bdinfo-rs-core', 'bdinfo-rs')) {
            Write-Host "publishing $crate@$version"
            $out = cargo publish -p $crate --locked 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              if ($out -match 'already (uploaded|exists)') {
                Write-Host "$crate@$version is already on crates.io — skipped, nothing was uploaded"
              } else {
                throw "cargo publish -p $crate failed (exit $LASTEXITCODE)"
              }
            }
          }

          # The step's exit code is $LASTEXITCODE from the last native command, so a
          # skipped LAST crate would fail the step with the cargo exit code this block
          # just decided to accept. That hides in the partial-recovery case, where the
          # last crate really does publish and exits 0; a re-run with everything already
          # published fails without this line. A genuine failure throws above and never
          # reaches it.
          exit 0
