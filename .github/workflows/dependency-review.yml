name: dependency-review

# Blocks a PR that introduces a dependency with a known vulnerability or an
# incompatible license. Uses the GitHub dependency graph, which is free on public
# repositories (needs GitHub Advanced Security on private repos). This workflow
# assumes a public repo.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # License policy: an ALLOWLIST (deny-licenses is deprecated upstream —
          # actions/dependency-review-action#997: a deny list can never
          # enumerate every incompatible license, removal planned for the next
          # major). The list is the UNION of the three authoritative deny.toml
          # allowlists (root + gui + wasm — the dependency graph spans all
          # three lockfiles, and a gui bump can introduce BSL-1.0/OFL-1.1);
          # `cargo deny check` remains the authoritative gate, this the PR-time
          # backstop. A new dependency license must be added deliberately in
          # BOTH places, same as the deny.toml policy already requires.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0, Zlib,
            MPL-2.0, CC0-1.0, BSL-1.0, OFL-1.1
          # Package-scoped exemptions, mirroring deny.toml's scoped exceptions:
          # our own workspace crates are LGPL-2.1-or-later (the allowlist above
          # is for DEPENDENCIES, permissive only — an LGPL dependency must
          # still fail), self_cell is `Apache-2.0 OR GPL-2.0-only` (we
          # distribute under the Apache-2.0 branch; deny.toml resolves the OR
          # expression correctly and remains authoritative), and
          # Swatinem/rust-cache is LGPL-3.0 but a CI-SIDE action — it runs on
          # the runner and ships nothing into any artifact, so the
          # distribution-license policy does not apply (it already runs in
          # every gate workflow; only a NEW workflow file re-surfaces it here).
          allow-dependencies-licenses: >-
            pkg:cargo/bdinfo-rs-core, pkg:cargo/bdinfo-rs,
            pkg:cargo/bdinfo-rs-gui, pkg:cargo/bdinfo-rs-wasm,
            pkg:cargo/self_cell,
            pkg:githubactions/Swatinem/rust-cache
          comment-summary-in-pr: on-failure
