name: sweep

# The completeness backstop that makes the orchestrator's area gating provably
# non-weakening: once a day, run EVERYTHING — the whole ci.yml
# orchestrator with every area forced (a workflow_call with a non-PR/push
# event makes the plan job fire all areas), plus the expensive tier the PR
# path deliberately does not carry: the full-crate `cargo mutants --in-place`
# sweeps for EVERY crate — the root workspace (core + CLI, sharded) and the
# gui and wasm sibling crates. These legs are the authoritative 0-missed
# mutation bar for the whole repo; there is no local full-sweep ritual.
# Untouched areas are thus re-verified within 24 h, and environment drift
# (runner images, toolchain point releases, a floating tool) cannot hide
# behind a skipped PR job. A scheduled failure files/refreshes ONE rolling
# issue; any green sweep that ran the orchestrator — scheduled or dispatched —
# closes it again. workflow_dispatch exists so the sweep can be exercised on
# demand, which is also how a fixed sweep clears the issue without waiting for
# the next cron.
#
# Release tags (v* for the CLI/library lane, gui-v* for the GUI lane) run
# the full-mutants legs ONLY — the authoritative 0-missed release checkpoint
# for every crate, riding alongside the publish lanes exactly like fuzz.yml's
# extended pass (it surfaces a regression, it does not block the release).
# Either tag fires all three legs: the tree-hash markers make the unchanged
# crates skip in seconds, so the extra coverage is free. The orchestrator
# call is skipped on tags: every area was already green on the master commit
# the tag must sit on (guard-ancestor), and the publish lanes must not
# compete with a fleet re-run.
#
# The full sweeps are guarded by a TREE-HASH CACHE MARKER (the mechanism the
# gui gate used as a PR-era stopgap, now owning the schedule): the sweep
# verifies the crate's SUITE against the crate's SOURCE, and both are captured
# exactly by the crate dir's git tree hash (lockfile and .cargo/mutants.toml
# included) plus rust-toolchain.toml — so a marker hit means this
# byte-identical tree already passed a full sweep, and re-running (tens of
# minutes of sharded fleet time) would re-verify unchanged inputs. The marker is saved only after a green
# sweep (implicit success() on the save step's `if:`), and only sweep runs
# save it — schedule runs execute on master, so the marker is master-scoped
# and restorable by the tag legs; a quiet day skips in seconds. Accepted
# cost: cache eviction (~7 days unused) causes one benign redundant sweep.

on:
  schedule:
    # Set EARLY on purpose, to compensate for a delay this repository does not
    # control. Cron is a request, and the grant here runs late: measured on
    # `0 8 * * *` over 2026-07-20..30 (n=11), every daily run fired, none on
    # time, lag 2 h 17 m to 4 h 00 m — never under two hours. Asking for 05:37
    # therefore lands the run at roughly 07:55-09:40 UTC.
    #
    # The lag tracks the day, not the workflow: this repository's 06:00 and
    # 07:00 UTC workflows shift by the same amount on the same day, so it is
    # neither this cron's hour nor its minute. Nor is it GitHub-wide — public
    # repositories on other accounts scheduled at 08:00 UTC fired within 5 to
    # 60 minutes of it when sampled on 2026-07-30. Cause unidentified; treat
    # the start time as approximate, and drop the compensation if the grant
    # ever tightens. Nothing downstream waits on this run.
    - cron: "37 5 * * *"   # daily 05:37 UTC, landing ~2-4 h later
  push:
    tags: ['v*', 'gui-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}
  # Never cancel a running sweep: a half-finished mutants pass saves no marker,
  # so cancellation only wastes the spent minutes.
  cancel-in-progress: false

jobs:
  # The whole PR/master gate, ungated: ci.yml's plan job sees a schedule /
  # workflow_dispatch event and fires every area, including the gui and wasm
  # reusables. Skipped on tag pushes (see the header).
  orchestrator:
    name: orchestrator
    if: github.event_name != 'push'
    uses: ./.github/workflows/ci.yml

  # Full mutation over the ROOT workspace (bdinfo-rs-core + the CLI), 0
  # missed — the leg that retired the local pre-release `cargo mt` ritual;
  # this sweep (daily + tags) is the authoritative core 0-missed bar. Policy
  # comes from the tracked .cargo/mutants.toml: test_workspace = true (every
  # mutant faces the whole suite, the CLI's end-to-end fixture flow included),
  # which is what makes this expensive — ~3-4 h on a 24-core dev box, more on
  # a 4-core hosted runner, against the 6 h job limit. So the run is SHARDED:
  # each shard builds its own baseline, then mutates a deterministic
  # fifteenth of the mutant list, fitting comfortably (minutes are free on a
  # public repo; concurrency is the only budget).
  core-mutants:
    name: core full mutants
    uses: ./.github/workflows/sweep-mutants.yml
    with:
      shards: '["0/15","1/15","2/15","3/15","4/15","5/15","6/15","7/15","8/15","9/15","10/15","11/15","12/15","13/15","14/15"]'
      # The key must capture EVERYTHING that can change a mutants verdict for
      # the root workspace — wider than the gui/wasm single-crate keys (miss
      # an input and a stale green marker lies): both crate trees, the
      # workspace manifest (lints + the [profile.mutants] build profile), the
      # lockfile, the mutants policy, the nextest profile (the `mutants`
      # profile's timeouts), and the toolchain — folded through sha256 to
      # keep the key short.
      marker-prefix: core-mutants-ok
      marker-paths: >-
        crates/bdinfo-rs-core crates/bdinfo-rs Cargo.toml Cargo.lock
        .cargo/mutants.toml .config/nextest.toml rust-toolchain.toml
      marker-fold: sha256
      # One cache lineage for all shards (identical baselines) — without it
      # each shard saves its own multi-GB target cache and the repo's 10 GB
      # Actions-cache budget churns, evicting the sweep markers and the
      # master-seeded PR caches. First finisher saves; the rest skip
      # gracefully.
      cache-shared-key: core-mutants

  # Full mutation over the GUI crate, 0 missed under the crate-local
  # .cargo/mutants.toml exclusions — SHARDED like the core leg (the one-job
  # run took ~1.7 h for 608 mutants; the shards divide that mutation phase,
  # each still paying the setup + iced/wgpu baseline, so the floor is the
  # baseline, not zero). Shard count is deliberately modest: the sweep's tail
  # is the core shards + these, and the account-wide concurrent-job budget
  # (~20) is the scarce resource, not minutes.
  gui-mutants:
    name: gui full mutants
    uses: ./.github/workflows/sweep-mutants.yml
    with:
      shards: '["0/5","1/5","2/5","3/5","4/5"]'
      working-directory: crates/bdinfo-rs-gui
      # Byte-identical to the key ci.yml's advisory gui PR-diff job builds
      # from the same prefix + paths — that is what lets a green sweep here
      # short-circuit the PR job (the composite owns the key format).
      marker-prefix: gui-mutants-ok
      marker-paths: crates/bdinfo-rs-gui rust-toolchain.toml
      # --workspace: without it cargo-mutants scopes to the root package and
      # silently skips the assets-gen member (whose byte-tie tests are its
      # mutant killers).
      mutants-args: --workspace
      # The deterministic software backend is what makes the iced_test
      # snapshot ties run on a GPU-less runner at all (same as gui.yml) —
      # they keep their mutant kill power (a palette or view-model mutation
      # shifts the rendered hash).
      extra-env: ICED_TEST_BACKEND=tiny-skia
      cache-workspaces: crates/bdinfo-rs-gui
      cache-shared-key: gui-mutants

  # Full mutation over the wasm crate, 0 missed under the crate-local
  # .cargo/mutants.toml exclusions (the cfg(wasm32) browser glue is verified
  # by the multi-runtime parity tests in the wasm gate instead). Unsharded on
  # purpose: a ~3-minute job would only get SLOWER paying N baselines, so one
  # leg runs everything and saves its own marker inline instead of through
  # the fan-in.
  wasm-mutants:
    name: wasm full mutants
    uses: ./.github/workflows/sweep-mutants.yml
    with:
      working-directory: crates/bdinfo-rs-wasm
      # Byte-identical to ci.yml's advisory wasm PR-diff key (see gui-mutants).
      marker-prefix: wasm-mutants-ok
      marker-paths: crates/bdinfo-rs-wasm rust-toolchain.toml
      marker-save: inline
      cache-workspaces: crates/bdinfo-rs-wasm
      cache-shared-key: wasm-mutants

  # ONE rolling issue for sweep failures (the ruff daily-fuzz pattern):
  # refreshed while the sweep stays red, closed again once a sweep passes.
  #
  # FILING stays scheduled-only — a workflow_dispatch run has a human reading
  # its log, who does not need an issue filed at them. CLOSING also accepts
  # workflow_dispatch, because re-dispatching is how a fixed sweep gets
  # re-verified and that run covers the same legs as a scheduled one, so its
  # green is equally authoritative. Gating the close on `schedule` too leaves a
  # resolved failure's issue standing until the next cron fires — the 08:00 UTC
  # schedule is routinely 1-3 h late, so that wait is a day, not hours.
  #
  # Tag pushes are excluded from both: the orchestrator job does not run on them
  # (see its `if:`), so a green tag run attests the mutants legs alone, never the
  # gated areas whose failure filed the issue.
  report:
    name: rolling failure issue
    # One entry per crate: a red anywhere inside a called sweep-mutants.yml
    # (a leg or its marker fan-in) reddens its caller job here, so the issue
    # title names the failing crate without listing its inner jobs.
    needs: [orchestrator, core-mutants, gui-mutants, wasm-mutants]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or refresh the rolling issue (close on green)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo
          # from — name it explicitly.
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $needs = $env:RESULTS | ConvertFrom-Json
          $failed = @($needs.PSObject.Properties |
              Where-Object { $_.Value.result -notin 'success', 'skipped' } |
              ForEach-Object { "$($_.Name): $($_.Value.result)" })
          gh label create ci-sweep --color ededed --description 'Daily full-sweep failures' --force | Out-Null
          $existing = gh issue list --state open --label ci-sweep --json number --jq '.[0].number'
          if ($failed.Count -eq 0) {
            if ($existing) {
              gh issue close $existing --comment "The sweep is green again: $env:RUN_URL" | Out-Null
              Write-Host "Closed issue #$existing"
            }
            else { Write-Host 'Sweep green; nothing to file.' }
            exit 0
          }
          # Red on a dispatched run: the operator who pressed the button reads
          # the failing jobs directly. Filing here would also let a dispatch
          # overwrite a scheduled failure's issue with a narrower one.
          if ($env:EVENT -ne 'schedule') {
            Write-Host "Sweep red on a $env:EVENT run ($($failed -join ', ')) — leaving the rolling issue to the scheduled sweep."
            exit 0
          }
          $title = "Daily sweep failed: $($failed -join ', ')"
          $body = @(
            'The daily full sweep (every area ungated + the full mutants tier) failed:'
            ''
            @($failed | ForEach-Object { "- $_" })
            ''
            "Run: $env:RUN_URL"
            ''
            'This is one rolling issue: refreshed while the sweep stays red, closed automatically by the next green sweep — the daily one, or a workflow_dispatch run once the cause is fixed.'
          ) -join "`n"
          if ($existing) {
            gh issue edit $existing --title $title --body $body | Out-Null
            Write-Host "Updated issue #$existing"
          }
          else {
            gh issue create --title $title --body $body --label ci-sweep | Out-Null
            Write-Host 'Filed the rolling issue'
          }
