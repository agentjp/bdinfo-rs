name: gui-publish

# The GUI's package-manager fan-out — the on-demand counterpart of the CLI's
# packages.yml / homebrew.yml / publish-crates.yml, publishing an EXISTING
# immutable gui-v* release's attested bytes to winget, the Homebrew tap
# (cask), the AUR, Cloudsmith, and crates.io. workflow_dispatch ONLY: the
# gui-v* tag ships the GitHub Release and nothing else (gui-release.yml), so
# every channel rollout is a deliberate dispatch — per channel for a staged
# first release, one `all` dispatch at steady state. Nothing is rebuilt here;
# every leg consumes (or points komac / the AUR at) release assets the verify
# job proved complete, checksum-exact, and attestation-verified.
#
# All-or-nothing: publishing starts only after EVERY selected channel's
# payload has validated. Three sequential phases:
#
#   verify    the release exists, is immutable, carries exactly the 12
#             expected assets + SHA256SUMS, every byte matches, every asset's
#             attestation verifies; resolves the channel matrix.
#   prepare   fail-fast matrix: each leg builds + validates its payload
#             (komac --dry-run manifests, the rendered cask, the PKGBUILD in
#             an Arch container, package-metadata assertions, cargo publish
#             --dry-run) and uploads it as a workflow artifact. Nothing has
#             been pushed anywhere when this phase fails.
#   publish   gated on ALL of prepare (and mode == publish): pushes the
#             pre-validated payloads. fail-fast is OFF here — cancelling a
#             sibling mid-push is worse than letting it finish — and every
#             leg is IDEMPOTENT (skip-if-present / commit-if-changed /
#             tolerate-already-uploaded), so re-dispatching after a partial
#             failure heals the failed channels and no-ops the finished ones.
#
# `mode: prepare-only` is the rehearsal lane: a dispatch-only workflow cannot
# run before it lands on master, so the first live exercise should be a
# prepare-only dispatch against an existing gui-v* release.
#
# Sequencing the legs enforce loudly rather than assume (details in the
# .github/scripts/publish-gui-*.ps1 headers):
#   - crates: bdinfo-rs-gui depends on bdinfo-rs-core at the same version, so
#     the leg needs the CLI release's publish-crates.yml run to have put that
#     core version on crates.io; until then the dry-run fails in prepare. The
#     crate must also already exist on crates.io for Trusted Publishing, so
#     the FIRST publish is manual (the publish-crates.yml bootstrap rule).
#   - winget: agentjp.bdinfo-rs-gui is a new package id komac cannot create
#     headlessly, so the FIRST submission is a manual interactive komac run;
#     the leg auto-submits every version after that PR merges.
#
# Secrets (all on the `release` ENVIRONMENT, like packages.yml — its
# deployment rules admit `master`, which is what a workflow_dispatch from the
# default branch resolves to): WINGET_TOKEN, HOMEBREW_TAP_TOKEN, AUR_SSH_KEY,
# CLOUDSMITH_API_KEY. crates.io needs no stored secret (OIDC Trusted
# Publishing, configured on crates.io for THIS workflow file). Only the
# publish job binds the environment; verify + prepare run with the read-only
# default token, so phase 1/2 cannot touch any external registry even in
# principle.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The gui-v* release to publish, e.g. gui-v2.0.0
        required: true
        type: string
      channels:
        description: Channel(s) to publish
        required: true
        default: all
        type: choice
        options: [all, winget, homebrew, aur, cloudsmith, crates]
      mode:
        description: publish, or prepare-only (validate + stage payloads, push nothing)
        required: true
        default: publish
        type: choice
        options: [publish, prepare-only]

permissions:
  contents: read

# One run per tag at a time: two concurrent publishes of the same release
# could race a channel's idempotency preflight into a duplicate submission.
concurrency:
  group: gui-publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  # Tool pins, hand-bumped (invisible to Dependabot; version-freshness.yml
  # watches them and asserts they agree with packages.yml's copies).
  KOMAC_VERSION: 2.16.0
  CLOUDSMITH_CLI_VERSION: 1.19.0

jobs:
  verify:
    name: verify the release (assets + checksums + attestations)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      channels: ${{ steps.verify.outputs.channels }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify the release and resolve the channel matrix
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CHANNELS: ${{ inputs.channels }}
          AUR_ENABLED: ${{ vars.AUR_ENABLED }}
        run: >-
          .github/scripts/publish-gui-verify.ps1
          -Tag $env:TAG -Channels $env:CHANNELS -OutDir release-assets

      # The prepare legs re-check everything they download against this copy,
      # so a release asset cannot change between the phases unnoticed.
      - name: Upload SHA256SUMS for the prepare legs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-publish-sums
          path: release-assets/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  prepare:
    name: prepare ${{ matrix.channel }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # The all-or-nothing barrier: any leg failing to validate kills the run
      # before the publish phase can start.
      fail-fast: true
      matrix:
        channel: ${{ fromJson(needs.verify.outputs.channels) }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the verified SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gui-publish-sums
          path: sums

      - name: winget — komac --dry-run manifests + manifest assertions
        if: matrix.channel == 'winget'
        shell: pwsh
        env:
          # komac and the winget-pkgs state probe only read public repos here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .github/scripts/publish-gui-winget.ps1
          -Version $env:VERSION -Mode prepare -Payload payload

      - name: homebrew — render the cask + syntax check
        if: matrix.channel == 'homebrew'
        shell: pwsh
        run: >-
          .github/scripts/publish-gui-homebrew.ps1
          -Version $env:VERSION -Mode prepare -Sums sums/SHA256SUMS -Payload payload

      - name: aur — render the PKGBUILD + validate in an Arch container
        if: matrix.channel == 'aur'
        shell: pwsh
        run: >-
          .github/scripts/publish-gui-aur.ps1
          -Version $env:VERSION -Sums sums/SHA256SUMS -Payload payload

      - name: cloudsmith — download the packages + metadata assertions
        if: matrix.channel == 'cloudsmith'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          .github/scripts/publish-gui-cloudsmith.ps1
          -Version $env:VERSION -Tag $env:TAG -Mode prepare -Sums sums/SHA256SUMS -Payload payload

      # The crates leg works on the tagged source — the same commit the
      # attested release was built from (gui-release.yml's guards admitted
      # the tag onto master before anything was published from it).
      - name: crates — check out the tagged source
        if: matrix.channel == 'crates'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          path: tag-src
          persist-credentials: false

      # No build cache, deliberately: this builds what publish ships, and a
      # cache poisoned in a less-trusted context must not taint it (the
      # publish-crates.yml discipline).
      - name: crates — cargo publish --dry-run at the tag
        if: matrix.channel == 'crates'
        shell: pwsh
        run: >-
          .github/scripts/publish-gui-crates.ps1
          -Tag $env:TAG -SrcDir tag-src -Mode prepare -Payload payload

      - name: Upload the validated payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-publish-payload-${{ matrix.channel }}
          path: payload/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish ${{ matrix.channel }}
    needs: [verify, prepare]
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    # The four channel secrets are ENVIRONMENT secrets on `release` (see the
    # header); a workflow_dispatch runs on the default branch's ref, which
    # the environment's `master` deployment rule admits.
    environment: release
    permissions:
      contents: read
      id-token: write # the crates leg's OIDC mint (crates.io Trusted Publishing)
    strategy:
      # DELIBERATELY not fail-fast: cancelling a sibling mid-push could
      # strand a channel half-published; a failed leg is healed by
      # re-dispatching it (every leg is idempotent), while the others finish.
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.verify.outputs.channels) }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the validated payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gui-publish-payload-${{ matrix.channel }}
          path: payload

      - name: winget — komac update --submit
        if: matrix.channel == 'winget'
        shell: pwsh
        env:
          # The bot PAT komac forks microsoft/winget-pkgs under; also serves
          # the script's read-only state probe.
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: >-
          .github/scripts/publish-gui-winget.ps1
          -Version $env:VERSION -Mode publish -Payload payload

      # Check out the TAP repo (not this one) with a token that can push to
      # it; persist-credentials stays true so the cask commit can push.
      - name: homebrew — check out the tap
        if: matrix.channel == 'homebrew'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: agentjp/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true # zizmor: ignore[artipacked] the token MUST persist to push the cask commit

      - name: homebrew — commit the cask to the tap
        if: matrix.channel == 'homebrew'
        shell: pwsh
        run: >-
          .github/scripts/publish-gui-homebrew.ps1
          -Version $env:VERSION -Mode publish -TapDir tap -CaskFile payload/bdinfo-rs-gui.rb

      # The action regenerates .SRCINFO, re-derives the checksums
      # (updpkgsums), test-builds in its own Arch container, and only then
      # pushes — a bad payload cannot reach the AUR. LICENSE + .gitignore ride
      # along for the same reasons as the CLI's aur job (packages.yml).
      - name: aur — push the PKGBUILD
        if: matrix.channel == 'aur'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: bdinfo-rs-gui-bin
          pkgbuild: payload/PKGBUILD
          assets: |
            packaging/aur/LICENSE
            packaging/aur/.gitignore
          updpkgsums: true
          test: true
          commit_username: bdinfo-rs CI
          commit_email: bdinfo-rs@users.noreply.github.com
          commit_message: Update to ${{ inputs.tag }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}

      - name: cloudsmith — push the packages
        if: matrix.channel == 'cloudsmith'
        shell: pwsh
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: >-
          .github/scripts/publish-gui-cloudsmith.ps1
          -Version $env:VERSION -Tag $env:TAG -Mode publish -Payload payload

      - name: crates — check out the tagged source
        if: matrix.channel == 'crates'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          path: tag-src
          persist-credentials: false

      - name: crates — authenticate (Trusted Publishing / OIDC)
        if: matrix.channel == 'crates'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: crates — cargo publish
        if: matrix.channel == 'crates'
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          .github/scripts/publish-gui-crates.ps1
          -Tag $env:TAG -SrcDir tag-src -Mode publish
