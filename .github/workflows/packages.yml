name: packages

# Fan-out package publishing, run AFTER release.yml ("Release") has built and
# uploaded the GitHub Release. release.yml (cargo-dist) creates that release with
# the default GITHUB_TOKEN, and GitHub suppresses the `release: released` event for
# token-created releases — so a `release`-triggered workflow never fires. Instead
# we chain off release.yml's completion via `workflow_run` (which DOES fire), and
# expose a manual `workflow_dispatch` for re-runs / backfills. Every job runs on a
# Linux runner; every action is SHA-pinned.
#
# The .deb/.rpm packages are now BUILT INSIDE the release (dist `extra-artifacts`
# -> .github/build-linux-packages.sh), so they are attached to the Release at
# creation, before it is published. This workflow therefore only DOWNLOADS those
# already-attached packages to install-verify them on a native-arch runner and push
# them to Cloudsmith — it no longer builds them, and (crucially) no longer uploads
# anything back to the Release. That post-publication `gh release upload` was the
# one thing incompatible with GitHub "immutable releases" (a release's assets freeze
# at publication); with it gone, immutability can be enabled. As a bonus the deb/rpm
# jobs now need only `contents: read`, resolving the two job-level `contents: write`
# Token-Permissions residuals (alerts #78/#79).
#
# Stable-only: the `gate` job skips prerelease tags (anything but a bare vX.Y.Z),
# matching the old `released`-event semantics and Homebrew's default.
#
# Channels handled ELSEWHERE (not here):
#   - Homebrew  -> release.yml (cargo-dist homebrew publish job)
#   - crates.io -> publish-crates.yml (OIDC)
#   - Scoop     -> the agentjp/scoop-bucket repo (Excavator auto-update bot)
#
# Secrets required (configure before the first release, or the jobs fail):
#   WINGET_TOKEN       - classic PAT (public_repo) on the bot account that forked winget-pkgs
#   AUR_SSH_KEY        - private SSH key whose public half is on the aur.archlinux.org account
#   CLOUDSMITH_API_KEY - Cloudsmith API key (used by the active deb/rpm jobs)
#
# These three publish secrets live on the `release` ENVIRONMENT (not as repo secrets), so
# only a release run can read them — a workflow on any other branch is structurally locked
# out. GOTCHA: this workflow fires on `workflow_run` (after Release), where github.ref is
# the DEFAULT BRANCH (master), NOT the release tag. So the `release` environment must allow
# deployments from the `master` branch for the jobs below to read the secrets. (The tag
# `v*` rule on that same environment is what admits the tag-triggered homebrew.yml instead.)
#
# NOTE: the deb/rpm CONTENTS (assets, metadata, the cargo-deb / cargo-generate-rpm
# invocation) live in build-linux-packages.sh + [package.metadata.{deb,generate-rpm}]
# in crates/bdinfo-rs/Cargo.toml; tweak packaging there, not here.

on:  # zizmor: ignore[dangerous-triggers] repackages published release assets; checks out master at the tag, never PR code
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, e.g. v1.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Resolve the release tag (from the dispatch input or the upstream run's tag)
  # and gate the fan-out: proceed only for a successful release.yml run (or a
  # manual dispatch) AND a stable vX.Y.Z tag (no prerelease suffix). The downstream
  # jobs read the tag from `needs.gate.outputs.version` into their own $VERSION.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      stable: ${{ steps.resolve.outputs.stable }}
    steps:
      - name: Resolve tag + stable check
        id: resolve
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          tag="$RAW_TAG"
          if [ -z "$tag" ]; then
            echo "Could not resolve a release tag from the event payload." >&2
            exit 1
          fi
          if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then stable=true; else stable=false; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Resolved tag '$tag' (stable=$stable)"
  # ── Windows: WinGet (Microsoft community repo) ─────────────────────────────
  winget:
    name: WinGet
    runs-on: ubuntu-latest
    environment: release # WINGET_TOKEN is an env secret on `release` (see header)
    # LIVE since 2026-07-07: agentjp.bdinfo-rs 1.0.0 merged into microsoft/winget-pkgs
    # (PR #390663), so a base manifest now exists. winget-releaser UPDATES an existing
    # package — it bases each new manifest on the prior version already in winget-pkgs —
    # so from here on every stable release auto-submits a new-version PR. (1.1.0 was
    # backfilled by hand with komac right after 1.0.0 merged; the first CI auto-submit is
    # the next tag.) Unconditional on a stable tag, like the deb/rpm and aur jobs.
    needs: gate
    if: needs.gate.outputs.stable == 'true'
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      # Komac release to pin — the tool the manual backfills use, and what
      # winget-releaser wrapped internally. A submission tool (not output-coupled),
      # so it is a static pin bumped by hand; the winget-pkgs manifest schema is
      # stable, so an occasional lag is harmless.
      KOMAC_VERSION: 2.16.0
    steps:
      # Submit with komac DIRECTLY — the same tool winget-releaser wraps, but
      # without its `cargo-bins/cargo-binstall@main` bootstrap, which this repo's
      # `sha_pinning_required` + allowlist policy (correctly) rejects. komac has no
      # taiki-e/install-action entry, so fetch its pinned release binary over curl
      # (a `run:` step, so no action-allowlist involvement at all).
      - name: Install komac
        run: |
          url="https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o komac.tar.gz
          tar -xzf komac.tar.gz komac
          sudo install -m755 komac /usr/local/bin/komac
          komac --version
      - name: Submit the new version to winget-pkgs
        # WINGET_TOKEN is the agentjp-bot PAT; komac reads it from GITHUB_TOKEN and
        # forks microsoft/winget-pkgs under that account (no fork-user flag needed).
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          base="https://github.com/agentjp/bdinfo-rs/releases/download/v${ver}"
          # Preflight: skip if this version already exists in winget-pkgs. komac has no
          # "already submitted?" guard, so a re-run/backfill of `--submit` would open a
          # DUPLICATE PR against microsoft/winget-pkgs that a moderator must close.
          #
          # FAIL CLOSED, never open. `komac list-versions` exits non-zero on ANY error
          # (verified: a clean success is exit 0 with the versions on stdout; an
          # invalid/EXPIRED WINGET_TOKEN is exit 1 with empty stdout — "GitHub token is
          # invalid"). The old `... 2>/dev/null | grep` swallowed that error, saw no match,
          # and FELL THROUGH TO --submit — so an expired token would spam a duplicate PR.
          # Instead capture the exit code: retry a transient failure, and if it still can't
          # be determined, FAIL the job (a blocked winget submit is safe + recoverable; a
          # duplicate PR to Microsoft is not). Only a CLEAN "version not present" submits.
          # (agentjp.bdinfo-rs has existed in winget-pkgs since the 1.0.0 hand-bootstrap, so
          # a real success always lists >=1 version — the "package does not exist" error,
          # which is also exit 1, cannot legitimately occur here.)
          versions=""; ok=0
          for attempt in 1 2 3; do
            if versions=$(komac list-versions agentjp.bdinfo-rs 2>/dev/null); then ok=1; break; fi
            echo "komac list-versions failed (attempt $attempt/3) — retrying..." >&2
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::komac list-versions could not determine existing winget-pkgs versions (invalid WINGET_TOKEN or GitHub API error) — refusing to --submit, which could open a duplicate PR. Re-run once resolved, or submit by hand with komac." >&2
            exit 1
          fi
          if printf '%s\n' "$versions" | sed 's/[[:space:]]//g' | grep -qxF "$ver"; then
            echo "agentjp.bdinfo-rs ${ver} already in winget-pkgs — skipping submit"
          else
            # Both windows-msvc .zip archives (x64 + arm64); komac reads the arch from
            # each. --submit opens the version-bump PR against microsoft/winget-pkgs.
            komac update agentjp.bdinfo-rs \
              --version "$ver" \
              --submit \
              --urls \
                "${base}/bdinfo-rs-x86_64-pc-windows-msvc.zip" \
                "${base}/bdinfo-rs-aarch64-pc-windows-msvc.zip"
          fi

  # ── Arch Linux: AUR (-bin, repackages the prebuilt musl binary) ────────────
  aur:
    name: AUR (bdinfo-rs-bin)
    runs-on: ubuntu-latest
    environment: release # AUR_SSH_KEY is an env secret on `release` (see header)
    # LIVE since 2026-07-14: the aur.archlinux.org account exists and its SSH key is
    # registered; AUR_SSH_KEY (release environment) holds the private half. The repo
    # variable AUR_ENABLED=true arms this job — unset it to pause AUR publishing
    # without a code change.
    needs: gate
    if: ${{ needs.gate.outputs.stable == 'true' && vars.AUR_ENABLED == 'true' }}
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Render the PKGBUILD for this version
        shell: bash
        run: |
          ver="${VERSION#v}"
          mkdir -p build/aur
          sed "s/__PKGVER__/${ver}/g" packaging/aur/PKGBUILD.template > build/aur/PKGBUILD
          cat build/aur/PKGBUILD

      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: bdinfo-rs-bin
          pkgbuild: build/aur/PKGBUILD
          # The AUR submission guidelines want the packaging scripts themselves
          # licensed (0BSD): ship packaging/aur/LICENSE into the AUR repo root.
          # (This licenses the PKGBUILD; the packaged binary stays LGPL.)
          # GOTCHA: with assets set the action commits via `git add --all`, which
          # sweeps in updpkgsums' downloaded tarballs + the test-built package —
          # the AUR push hook rejects those (max blob 488 KiB). The .gitignore
          # asset keeps them out; never drop it while assets are in use.
          assets: |
            packaging/aur/LICENSE
            packaging/aur/.gitignore
          updpkgsums: true # download the release tarballs and write real sha256sums
          test: true # build the package in an Arch container before pushing
          commit_username: bdinfo-rs CI
          commit_email: bdinfo-rs@users.noreply.github.com
          commit_message: Update to ${{ env.VERSION }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}

  # ── Debian/Ubuntu: .deb attached to the release (x64 + arm64) ──────────────
  deb:
    name: .deb (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    environment: release # CLOUDSMITH_API_KEY is an env secret on `release` (see header)
    needs: gate
    if: needs.gate.outputs.stable == 'true'
    # contents: read (inherited) is enough — the .deb is already a release asset; this
    # job downloads + verifies + pushes to Cloudsmith and uploads nothing back. (The
    # old job needed contents: write for `gh release upload`; dropping it resolves the
    # #78/#79 Token-Permissions residuals.)
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      fail-fast: false
      # One NATIVE runner per arch so the install test runs the arch-matching binary
      # (x64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) — no emulation/Docker.
      matrix:
        include:
          - {triple: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {triple: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm}
    steps:
      # The package was built + attached to the release by dist `extra-artifacts`
      # (.github/build-linux-packages.sh); just pull it back to verify + republish.
      - name: Download the .deb attached to the release
        shell: bash
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" -p "bdinfo-rs-${{ matrix.triple }}.deb" -D dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the .deb (install + run + man/completions on the native arch)
        shell: bash
        run: |
          set -euo pipefail
          deb="dl/bdinfo-rs-${{ matrix.triple }}.deb"
          echo "== $deb =="; dpkg-deb --contents "$deb"
          sudo dpkg -i "$deb"
          bdinfo-rs --version
          # cargo-deb gzips the man page (.1.gz); cargo-generate-rpm keeps it (.1) — accept either.
          ls /usr/share/man/man1/bdinfo-rs.1* >/dev/null 2>&1 || { echo "NOT INSTALLED: man page"; exit 1; }
          for f in /usr/bin/bdinfo-rs /usr/share/bash-completion/completions/bdinfo-rs /usr/share/zsh/site-functions/_bdinfo-rs /usr/share/fish/vendor_completions.d/bdinfo-rs.fish; do
            test -f "$f" || { echo "NOT INSTALLED: $f"; exit 1; }
          done
          # Debian carries NO License field in control metadata — the license lives only in
          # the DEP-5 copyright, which is what license scanners (Cloudsmith) read. Assert the
          # copyright installed AND carries the machine-readable License short-name.
          grep -q '^License: LGPL-2.1-or-later' /usr/share/doc/bdinfo-rs/copyright || { echo "NOT INSTALLED: DEP-5 copyright License field"; exit 1; }
          echo "${{ matrix.triple }} .deb: installs, runs, and ships man + completions + DEP-5 copyright"

      # Publish the SAME bytes to the Cloudsmith apt repo so users can `apt install
      # bdinfo-rs` by name (one `any-distro/any-version` upload serves every
      # Debian-family distro).
      #
      # IDEMPOTENT by preflight (best practice, replacing the old unconditional
      # `--republish`): a workflow_dispatch re-run / backfill must not re-upload a
      # version that is already there. A plain re-push of an existing version uploads
      # then FAILS mid-sync ("...already exists...This package should be deleted"),
      # leaving a broken entry; `--republish` avoids that but needlessly re-uploads and
      # is discouraged by Cloudsmith. So query the public API by filename (matching the
      # version base — Cloudsmith stores it revisioned, e.g. 1.2.0-1) and SKIP if present;
      # push cleanly (no `--republish`) only when absent. `--republish`
      # is kept solely as the safe fallback for the two cases where a plain push would
      # otherwise strand a broken entry: the preflight could not determine state, or the
      # push races another run and hits "already exists".
      - name: Publish the .deb to Cloudsmith
        shell: bash
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -euo pipefail
          pipx install cloudsmith-cli==1.19.0 >/dev/null
          ver="${VERSION#v}"
          repo=bdinfo-rs/bdinfo-rs
          file="dl/bdinfo-rs-${{ matrix.triple }}.deb"
          # Cloudsmith stores the packaging-revisioned version (e.g. 1.2.0-1), so a bare
          # `version:${ver}` matches NOTHING. Query the anonymous public API by the exact
          # filename and match the version BASE (strip the trailing -<revision>) — exact
          # and revision-agnostic. count stays empty on any query error → --republish fallback.
          count=""
          if json=$(curl -sSf -G "https://api.cloudsmith.io/v1/packages/$repo/" --data-urlencode "query=filename:bdinfo-rs-${{ matrix.triple }}.deb" --data-urlencode "page_size=100" 2>/dev/null); then
            count=$(printf '%s' "$json" | jq --arg v "$ver" '[.[] | select((.version | sub("-[0-9]+$"; "")) == $v)] | length' 2>/dev/null || true)
          fi
          if [ -n "$count" ] && [ "$count" != "0" ]; then
            echo "bdinfo-rs-${{ matrix.triple }}.deb ${ver} already in Cloudsmith (${count}) — skipping"
          elif [ "$count" = "0" ]; then
            cloudsmith push deb "$repo/any-distro/any-version" "$file" \
              || { echo "plain push failed — retrying idempotently with --republish"; cloudsmith push deb --republish "$repo/any-distro/any-version" "$file"; }
          else
            echo "could not query Cloudsmith state — pushing with --republish (safe)"
            cloudsmith push deb --republish "$repo/any-distro/any-version" "$file"
          fi

  # ── Fedora/RHEL: .rpm attached to the release (x64 + arm64) ────────────────
  rpm:
    name: .rpm (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    environment: release # CLOUDSMITH_API_KEY is an env secret on `release` (see header)
    needs: gate
    if: needs.gate.outputs.stable == 'true'
    # contents: read (inherited) is enough — see the .deb job; this uploads nothing back.
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      fail-fast: false
      # One NATIVE runner per arch so the install test runs the arch-matching binary
      # (x64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) — no emulation/Docker.
      matrix:
        include:
          - {triple: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {triple: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm}
    steps:
      # The package was built + attached to the release by dist `extra-artifacts`
      # (.github/build-linux-packages.sh); just pull it back to verify + republish.
      - name: Download the .rpm attached to the release
        shell: bash
        run: gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" -p "bdinfo-rs-${{ matrix.triple }}.rpm" -D dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the .rpm (install + run + man/completions on the native arch)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          sudo rpm --initdb 2>/dev/null || true
          rpmf="dl/bdinfo-rs-${{ matrix.triple }}.rpm"
          echo "== $rpmf =="; rpm -qpl "$rpmf"
          # rpm tool on Ubuntu lays the package's files onto the filesystem; --nodeps
          # (the binary is static, no deps) and --ignorearch (rpm's host-arch string
          # may not match the package arch label) keep it from balking.
          sudo rpm -i --nodeps --ignorearch --force "$rpmf"
          bdinfo-rs --version
          # cargo-deb gzips the man page (.1.gz); cargo-generate-rpm keeps it (.1) — accept either.
          ls /usr/share/man/man1/bdinfo-rs.1* >/dev/null 2>&1 || { echo "NOT INSTALLED: man page"; exit 1; }
          for f in /usr/bin/bdinfo-rs /usr/share/bash-completion/completions/bdinfo-rs /usr/share/zsh/site-functions/_bdinfo-rs /usr/share/fish/vendor_completions.d/bdinfo-rs.fish; do
            test -f "$f" || { echo "NOT INSTALLED: $f"; exit 1; }
          done
          echo "${{ matrix.triple }} .rpm: installs (rpm -i), runs, and ships man + completions"

      # Publish the SAME bytes to the Cloudsmith yum repo so users can `dnf install
      # bdinfo-rs` by name (one `any-distro/any-version` upload serves every
      # RPM-family distro). Preflight-skip-if-present, `--republish` only as the safe
      # fallback — see the .deb job for the full rationale.
      - name: Publish the .rpm to Cloudsmith
        shell: bash
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -euo pipefail
          pipx install cloudsmith-cli==1.19.0 >/dev/null
          ver="${VERSION#v}"
          repo=bdinfo-rs/bdinfo-rs
          file="dl/bdinfo-rs-${{ matrix.triple }}.rpm"
          # Match the version BASE via the anonymous public API — see the .deb job for why
          # a bare `version:${ver}` misses Cloudsmith's revisioned version (e.g. 1.2.0-1).
          count=""
          if json=$(curl -sSf -G "https://api.cloudsmith.io/v1/packages/$repo/" --data-urlencode "query=filename:bdinfo-rs-${{ matrix.triple }}.rpm" --data-urlencode "page_size=100" 2>/dev/null); then
            count=$(printf '%s' "$json" | jq --arg v "$ver" '[.[] | select((.version | sub("-[0-9]+$"; "")) == $v)] | length' 2>/dev/null || true)
          fi
          if [ -n "$count" ] && [ "$count" != "0" ]; then
            echo "bdinfo-rs-${{ matrix.triple }}.rpm ${ver} already in Cloudsmith (${count}) — skipping"
          elif [ "$count" = "0" ]; then
            cloudsmith push rpm "$repo/any-distro/any-version" "$file" \
              || { echo "plain push failed — retrying idempotently with --republish"; cloudsmith push rpm --republish "$repo/any-distro/any-version" "$file"; }
          else
            echo "could not query Cloudsmith state — pushing with --republish (safe)"
            cloudsmith push rpm --republish "$repo/any-distro/any-version" "$file"
          fi

  # ── Verify the PUBLISHED Cloudsmith repo: install bdinfo-rs BY NAME and confirm
  # ── the binary + man + completions all land — on both arches, native runners, no
  # ── Docker. Runs after `deb` has pushed; retries while the apt index propagates.
  cloudsmith-verify:
    name: verify Cloudsmith apt install (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    needs: [gate, deb]
    if: needs.gate.outputs.stable == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {triple: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {triple: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm}
    steps:
      # A CLEAN container (not the runner) = a faithful "fresh user" install and no
      # interference from the runner's pre-seeded apt state. The arm64 runner runs an
      # arm64 container natively, so each arch verifies its own Cloudsmith package.
      # The retry absorbs apt-index propagation right after the deb job's push.
      - name: apt install bdinfo-rs from Cloudsmith (clean container) + check man/completions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm ubuntu:latest bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq curl ca-certificates
            # Minimal Ubuntu images dpkg-exclude /usr/share/man/* to stay small;
            # drop that so the install is complete like a real system (the man page
            # IS in the .deb — the runner-based deb job already proves it installs).
            rm -f /etc/dpkg/dpkg.cfg.d/excludes
            for i in $(seq 1 12); do
              if curl -1sLf "https://dl.cloudsmith.io/public/bdinfo-rs/bdinfo-rs/setup.deb.sh" | bash \
                 && apt-get install -y -qq bdinfo-rs; then ok=1; break; fi
              echo "waiting for the Cloudsmith index to propagate... ($i)"; sleep 10
            done
            [ -n "${ok:-}" ] || { echo "could not apt install bdinfo-rs from Cloudsmith"; exit 1; }
            bdinfo-rs --version
            ls /usr/share/man/man1/bdinfo-rs.1* >/dev/null 2>&1 || { echo "MISSING: man page"; exit 1; }
            for f in /usr/bin/bdinfo-rs /usr/share/bash-completion/completions/bdinfo-rs /usr/share/zsh/site-functions/_bdinfo-rs /usr/share/fish/vendor_completions.d/bdinfo-rs.fish; do
              test -f "$f" || { echo "MISSING: $f"; exit 1; }
            done
            echo "Cloudsmith apt install ships the binary + man + completions"
          '
