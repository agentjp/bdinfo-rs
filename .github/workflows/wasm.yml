name: wasm

# The PROPORTIONATE gate for the in-browser package (crates/bdinfo-rs-wasm +
# web/), mirrored locally by scripts/wasm-compliance.ps1. NOT the core's
# 100%-cov / 0-mutant bar (the parser core carries that, unchanged) — here the
# bar is: it formats, lints clean (calibrated set, -D warnings), builds for
# wasm32, the wasm-opt'd payload stays under the committed size budget, the TS is
# type-clean + biome-clean, and the FULL measured scan renders BYTE-IDENTICAL to
# this crate's own golden (rendered from the same Big Buck Bunny fixture the
# native CLI e2e test scans) — proven in Node and in real headless browsers
# (Chrome + Firefox via wasm-bindgen-test).
#
# A workflow_call REUSABLE: ci.yml invokes it when its plan job fires either
# of the two areas passed through as inputs, and each job below keys on its
# own input: `wasm` (a crate-dir change, or a core change via the encoded
# path-dep edge — root-Cargo.lock-only bumps excluded) runs the gate job, and
# `deps` runs the msrv job. The daily sweep re-runs everything ungated
# through the same orchestrator (its plan fires every area). Trigger/concurrency policy is the
# caller's; the gate still deliberately NEVER runs on tags, so its build
# caches are never a publishing-time cache-poisoning vector (the tag-driven
# npm publish lives beside publish-crates.yml in publish-npm.yml). The
# full-crate mutants sweep lives in sweep.yml (daily when the crate tree
# changed since the last green sweep, plus release tags — the authoritative
# 0-missed checkpoints); the PR path gets the advisory in-diff mutants job in
# ci.yml (`wasm mutation testing (PR diff)`) instead. Inside the
# reusable this gate renders as `wasm / wasm gate (build + size + parity)`;
# it gates merges through the caller job and ci-ok, not by its own name —
# branch protection requires `ci-ok` alone among the CI jobs.

on:
  workflow_call:
    inputs:
      wasm:
        description: The wasm crate, its gate files, or bdinfo-rs-core (a path dependency) changed.
        required: true
        type: string
      deps:
        description: The dependency graph or the audit policy changed.
        required: true
        type: string

permissions:
  contents: read

env:
  # Keep the cached target/ small: no incremental-compilation metadata, and
  # line tables instead of full DWARF (still enough for file:line in a test
  # backtrace). A called workflow inherits none of its caller's env, so these
  # are declared here as well as in ci.yml — which carries the rationale.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  gate:
    name: wasm gate (build + size + parity)
    if: inputs.wasm == 'true'
    # x64: two steps below need Google Chrome and chromedriver, and the arm64
    # Ubuntu runner image ships neither (its browser set is Firefox +
    # geckodriver; CHROMEWEBDRIVER is empty there). `msrv` below stays beside
    # this job so both legs of this gate share one arch and one cache lineage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pins
        uses: ./.github/actions/pins

      # The LGPL hygiene rule that the npm tarball's web/ LICENSE + NOTICE copies
      # still match their repo-root originals — the single-source script the
      # local gate runs too. Cheap + dependency-free, so it runs first.
      - name: LICENSE/NOTICE parity (web copies match the repo root)
        shell: pwsh
        run: ./.github/scripts/wasm-rules.ps1 -Check licenses

      - name: Install pinned nightly rustfmt + llvm-tools (for llvm-cov)
        env:
          NIGHTLY: ${{ steps.pins.outputs.NIGHTLY }}
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt --component llvm-tools-preview

      # The wasm32 target, the pinned wasm-bindgen CLI, the pinned Node and
      # `npm ci` — the same block publish-npm.yml and deploy-pages.yml build the
      # shipped artifact with. `npm run build` runs far below instead of here:
      # every gate step between the two would otherwise be measuring a stale
      # artifact.
      - uses: ./.github/actions/wasm-build
        with:
          web: install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/bdinfo-rs-wasm
          # Cache write-discipline (wgpu): PR-branch saves are invisible to
          # every other PR, so only master runs (pushes + the daily sweep)
          # save; PRs restore the master-seeded cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The installed wasm-bindgen-cli MUST equal the wasm-bindgen version
      # resolved in Cargo.lock — wasm-bindgen hard-errors on any crate<->CLI
      # mismatch. The two move independently: Dependabot bumps the crate in the
      # lockfile and cannot touch the hand-maintained CLI pin, so this catches
      # that drift here, with the exact fix, instead of inside a wasm-bindgen
      # invocation later in the build.
      - name: wasm-bindgen CLI matches the lockfile
        working-directory: crates/bdinfo-rs-wasm
        shell: pwsh
        run: |
          $lock = [regex]::Match((Get-Content -Raw Cargo.lock), '(?m)^name = "wasm-bindgen"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (-not $lock) { throw 'could not read the wasm-bindgen version from Cargo.lock' }
          $cli = [regex]::Match((& wasm-bindgen --version), '([0-9]+\.[0-9]+\.[0-9]+)').Value
          Write-Host "Cargo.lock wasm-bindgen $lock / CLI $cli"
          if ($lock -ne $cli) {
            throw "wasm-bindgen mismatch: Cargo.lock=$lock CLI=$cli. Set WASM_BINDGEN_CLI=$lock in .github/pins.env."
          }

      # `fallback: none`: install only from the action's checksummed manifest,
      # never its runtime-resolved cargo-binstall fallback (rationale in core.yml).
      - name: Install the Rust gate tools (llvm-cov / nextest / machete / shear / typos)
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-machete,cargo-shear,cargo-deny,typos-cli
          fallback: none

      # The fixed unsafe-token count in src/lib.rs (the cfg-gated marker impls the
      # browser bindings need) — the same single-source script, which carries the
      # count and what each token is.
      - name: Unsafe tripwire (exactly three unsafe tokens in lib.rs)
        shell: pwsh
        run: ./.github/scripts/wasm-rules.ps1 -Check unsafe

      # rustfmt / typos / machete / shear — the quartet gui.yml's checks job runs
      # identically, in .github/actions/lint-crate.
      - uses: ./.github/actions/lint-crate
        with:
          working-directory: crates/bdinfo-rs-wasm

      # Supply-chain audit of the wasm crate's OWN dependency tree (js-sys /
      # wasm-bindgen / web-sys — compiled into the shipped `.wasm` but invisible to
      # the root audit, which `exclude`s this independent workspace). Uses the
      # crate-local crates/bdinfo-rs-wasm/deny.toml, which mirrors the root
      # allowlist + posture; cargo-deny discovers it from the target manifest's
      # workspace root. Run from the crate directory, where the `dn` alias lives
      # (.cargo/config.toml).
      - name: cargo-deny (wasm dep audit — advisories / licenses / bans / sources)
        working-directory: crates/bdinfo-rs-wasm
        run: cargo dn

      - name: Clippy (wasm32, calibrated, -D warnings)
        working-directory: crates/bdinfo-rs-wasm
        run: cargo ltw

      - name: Clippy (native, -D warnings)
        working-directory: crates/bdinfo-rs-wasm
        run: cargo lt

      - name: Build (wasm32, release)
        working-directory: crates/bdinfo-rs-wasm
        run: cargo build --target wasm32-unknown-unknown --release --locked

      - name: Doc (wasm32, warnings = errors)
        working-directory: crates/bdinfo-rs-wasm
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo dc

      - name: Coverage (llvm-cov nextest, native — Tier A 100% lines/regions/functions)
        working-directory: crates/bdinfo-rs-wasm
        shell: pwsh
        env:
          NIGHTLY: ${{ steps.pins.outputs.NIGHTLY }}
        # The floor itself lives in the single-source .github/scripts/cov-floor.ps1
        # the local gate runs too. The crate's own src/ is the denominator: the
        # bdinfo-rs-core path dependency is measured by the root workspace, and
        # the browser glue is #[cfg(target_arch = "wasm32")]-gated out of this
        # native build. No branch floor is passed — branch counts are
        # platform-variant (see cov-floor.ps1).
        run: |
          $json = Join-Path $env:RUNNER_TEMP 'wasm-cov.json'
          cargo "+$env:NIGHTLY" llvm-cov nextest --locked --no-tests=fail --json --output-path $json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ../../.github/scripts/cov-floor.ps1 -JsonPath $json -Label 'wasm coverage' -Include 'bdinfo-rs-wasm[\\/]src[\\/]'

      - name: Build the browser artifact (wasm-bindgen + wasm-opt -Oz + tsc)
        working-directory: crates/bdinfo-rs-wasm/web
        run: npm run build

      - name: Size budget (optimized .wasm)
        working-directory: crates/bdinfo-rs-wasm/web
        run: npm run --silent size

      - name: biome check
        working-directory: crates/bdinfo-rs-wasm/web
        run: npm run --silent check

      - name: tsc --noEmit
        working-directory: crates/bdinfo-rs-wasm/web
        run: npm run --silent typecheck

      # Published type-surface guard, run on the just-built dist/ + pkg/: publint
      # validates package.json's exports / files / types wiring, and attw packs the
      # tarball and type-checks every resolution so the consumer-facing type
      # surface can't silently regress. The package is intentionally ESM-only, so
      # attw runs the `esm-only` profile — the default profile's node10 / CJS
      # "failures" are inherent to ESM-only (a dynamic import is required from CJS),
      # not a regression. Both float to latest like the other advisory linters.
      - name: Published package type guard (publint + attw)
        working-directory: crates/bdinfo-rs-wasm/web
        run: |
          npx --yes publint
          npx --yes @arethetypeswrong/cli --pack --profile esm-only

      - name: Node golden-parity (scan_files == golden, byte-exact)
        working-directory: crates/bdinfo-rs-wasm/web
        run: npm run --silent test:node

      # Real-browser STREAMING path: the production Worker + FileReaderSync
      # scan_files seam (web/test/parity.chrome.mjs) driven by playwright-core
      # against the runner's system Google Chrome (preinstalled on ubuntu-latest),
      # over the committed fixture handed in as in-browser File objects. Same
      # measured scan as the Node parity step, but exercising the REAL
      # off-main-thread Worker byte-offset reads end to end and asserting the report
      # byte-identical to the golden — the only step that runs the shipped
      # scan_files path in a browser (the wasm-bindgen-test steps below run
      # tests/parity.rs via the wasm-bindgen harness, not the Worker seam).
      - name: Real-browser Worker parity (Chrome — scan_files streaming)
        working-directory: crates/bdinfo-rs-wasm/web
        run: npm run --silent test:chrome

      # Real-browser execution: the SAME measured-scan parity test (tests/parity.rs)
      # run headless via wasm-bindgen-test. The runner picks the browser from the
      # driver env var set for that step (geckodriver / chromedriver are preinstalled
      # on ubuntu-latest; CHROMEWEBDRIVER / GECKOWEBDRIVER point at their dirs).
      - name: wasm-bindgen-test (Firefox)
        working-directory: crates/bdinfo-rs-wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        # GECKOWEBDRIVER is a runner OS env var (the geckodriver dir), so it must be
        # read in the shell ($GECKOWEBDRIVER) — the ${{ env.* }} context only sees
        # workflow-level env: and resolves empty, yielding a bogus /geckodriver path.
        run: GECKODRIVER="$GECKOWEBDRIVER/geckodriver" cargo test --target wasm32-unknown-unknown --release --locked --test parity

      - name: wasm-bindgen-test (Chrome)
        working-directory: crates/bdinfo-rs-wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        # CHROMEWEBDRIVER is a runner OS env var (the chromedriver dir) — read it in
        # the shell ($CHROMEWEBDRIVER); the ${{ env.* }} context resolves empty.
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --target wasm32-unknown-unknown --release --locked --test parity

  # The wasm crate's leg of the MSRV gate — the shared body, the rationale and
  # the build-only posture live in .github/actions/msrv-check (dev-dependency
  # here: wasm-bindgen-test may float its own MSRV; the gate job above runs the
  # suites on the pinned stable). BOTH targets, because the crate SHIPS as
  # wasm32: the native check is what `cargo check` covers on any host, and the
  # wasm32 release build is the configuration published to npm, so
  # target-specific MSRV breakage in js-sys/web-sys/wasm-bindgen would otherwise
  # pass unnoticed. `msrv` in core.yml and `gui msrv` in gui.yml hold the same
  # bar for the other two shipping surfaces.
  # Keyed on `deps` like `msrv` in core.yml, which carries the rationale; the
  # daily sweep fires every area and so still runs this daily.
  msrv:
    name: wasm msrv
    if: inputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/msrv-check
        with:
          package: bdinfo-rs-wasm
          manifest-path: crates/bdinfo-rs-wasm/Cargo.toml
          working-directory: crates/bdinfo-rs-wasm
          target: wasm32-unknown-unknown
          check-args: --locked
          build-args: --target wasm32-unknown-unknown --release --locked
          cache-workspaces: crates/bdinfo-rs-wasm
