name: fuzz

# The DISCOVERY half of the adversarial tier: fresh (mutating) fuzz runs over
# every libFuzzer target at both shipped pointer widths — nightly, and again on
# every v* release tag. cargo-fuzz / libFuzzer need a nightly toolchain and have
# no Windows MSVC support, so this runs on Linux only; the local mirror is
# scripts/fuzz-docker.{ps1,sh} (Windows via Docker) — the guards, the arches and
# the per-target discovery flags here match it, both sides reading
# fuzz/targets.txt. The fast per-PR/push leg — replaying the committed seed
# corpus with -runs=0 (the `corpus replay (regression gate, <arch>)` checks) —
# lives in core.yml as a plan-gated job on the `fuzz` area; the daily sweep
# re-runs it ungated.
#
# TWO POINTER WIDTHS, ONE CORPUS. The npm package compiles bdinfo-rs-core to
# wasm32-unknown-unknown, where `usize` is 32 bits, so every checked_* offset
# guard and length computation in the parser has a different overflow boundary
# in a browser than on the 64-bit host. wasm32 cannot host libFuzzer;
# i686-unknown-linux-gnu is a supported libFuzzer target at the same width, so
# it is the proxy — and it is the width with the least operator supervision,
# since a browser hands this parser arbitrary files with nobody in the loop.
# Both arches run the SAME per-target flags out of fuzz/targets.txt and feed the
# SAME corpus: a libFuzzer corpus is arch-agnostic byte files, so a unit found at
# one width is a valid seed at the other (D6).
#
# What makes discovery COMPOUND is the per-target corpus cache: a leg starts
# from the committed seeds PLUS everything earlier runs found, and saves the
# minimised difference back. Before that cache existed, every run restarted from
# the same seeds and re-explored the same shallow neighbourhood — measured
# 2026-08-03, a 120 s pass over all ten targets grew the corpus from 6,254 to
# 14,178 units and discarded every one of them, so run N+1 learned roughly what
# run N learned.
#
# Each leg runs FOUR libFuzzer processes over its one shared corpus directory,
# not one. A standard hosted runner is 4 vCPU / 16 GB on a PUBLIC repository and
# 2 vCPU / 8 GB on a private one — the public figure is the one that applies here
# and the one that is easy to get wrong — so a single-process leg used a quarter
# of the machine. Buying the other three cores buys executions INSIDE the
# existing budget, which is the direction the cadence measurement below points;
# raising FUZZ_SECONDS instead would push against it.
#
# CADENCE: an unconditional nightly FLOOR plus extra slots selected at run time
# by the FUZZ_SCHEDULE repository variable, so retuning how often the pass runs
# is a variable edit rather than a pull request. What forces the frequency is
# not the fuzzer but the corpus cache below. This repository's Actions cache
# store sits at 9.9-11.4 GB against GitHub's 10 GB limit, so LRU eviction runs
# whenever merges write new build caches, and an entry touched once a day is the
# LRU tail: measured 2026-08-07..12, the accumulated corpus compounded from
# 30,373 to 47,303 units beyond the committed seeds over four quiet days, and
# one merge-heavy day (fourteen dependency pull requests merged inside two
# hours) erased it — the next pass restored 3,461. An entry re-saved every 3 h
# is never the tail. Fuzzing independently has diminishing returns within a run
# and compounding returns across runs, so frequent short runs beat rare long
# ones once the corpus persists; and a weekly schedule would fail outright,
# since GitHub evicts a cache unused for 7 days and a cron here fires late by
# anything from half an hour to four (the schedule block below carries the
# measurement) — the jitter that turns "rides the eviction boundary" into
# "crossed it".
#
# CORPUS GROWTH IS HUMAN-GATED: a leg that ends with more units than it
# restored uploads them as an artifact and the report job names the count in one
# rolling issue. Nothing is committed by CI — signed-commit branch protection
# and a 735 MB .git are both reasons the regression set grows only through a
# reviewed pull request.
#
# The tag pass runs ALONGSIDE the publish workflows the same tag triggers
# (v-release/publish-crates/publish-npm) and does NOT block them — a crash
# surfaces a regression to fix in a follow-up patch; it is a post-tag
# adversarial sweep, not a gate.

on:
  push:
    tags: ['v*']
  schedule:
    # Every candidate slot is declared here and only some of them fuzz: GitHub
    # resolves `on.schedule` from the default branch, where a repository
    # variable cannot reach, so the selection happens in the `targets` job's
    # `if` below and FUZZ_SCHEDULE holds the extra slots to honour. 21:11 is the
    # floor and fires whatever the variable says. Each string is compared
    # char-for-char against github.event.schedule, so these lines, that
    # condition's literals and the variable's elements must stay byte-identical.
    #
    # The hours are the REQUEST, not the firing time, and how late a slot fires
    # differs between the workflows in this repository — sweep.yml's header
    # records 2 h 17 m to 4 h 00 m over n=11 days for its own cron, which is not
    # this file's distribution. Measured on this workflow's ten scheduled runs
    # from 2026-08-03 to 2026-08-12: nine fired 29 to 68 minutes late and one
    # (2026-08-06) fired 3 h 51 m late. So 21:11 UTC usually starts inside the
    # 21:40-22:20 window, and 03:11 usually starts inside 03:40-04:20 — well
    # ahead of the 05:37 daily sweep. It is the rare outlier that puts 03:11
    # near 07:00, alongside that sweep's ~20-job mutation fleet, which is the
    # account's concurrent-job ceiling — accepted deliberately: the two queue
    # against each other, which costs wall time, not runner minutes (unmetered
    # on a public repository).
    - cron: "11 0 * * *"
    - cron: "11 3 * * *"
    - cron: "11 6 * * *"
    - cron: "11 9 * * *"
    - cron: "11 12 * * *"
    - cron: "11 15 * * *"
    - cron: "11 18 * * *"
    - cron: "11 21 * * *" # the floor
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target fresh-fuzz budget in seconds
        default: "300"
      workers:
        description: Concurrent libFuzzer processes per target - 4 = one per runner vCPU, 1 = the single-process arm, 0 = no multi-process wrapper at all
        default: "4"
      file_issues:
        description: File crash / corpus-growth issues from this run (schedule and tag runs always do)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  # Never cancel a running pass: a cancelled leg saves no corpus cache, so
  # cancellation throws away everything the run had discovered (sweep.yml's
  # marker legs are cancel-proof for the same reason).
  cancel-in-progress: false

env:
  # Per-unit guards (mirror scripts/fuzz-docker.sh): -timeout bounds a single
  # unit's wall time (non-termination guard); -rss_limit_mb bounds its memory
  # (allocation-amplification guard). Both turn a hang or an allocation blow-up
  # into a libFuzzer crash, which is what makes them reportable below.
  # -rss_limit_mb is PER FUZZER PROCESS and WORKERS of them run at once, so the
  # guard now bounds the leg at 4 x 2048 MiB = 8 GiB against the runner's 16 GB.
  # Raising either number has to be checked against that product, not against
  # the single-process figure this line used to mean.
  GUARDS: -timeout=25 -rss_limit_mb=2048

jobs:
  # The target list comes from fuzz/targets.txt — the same file that carries the
  # per-target discovery flags and that scripts/fuzz-docker.sh and core.yml's
  # replay job read. Adding a target is then two edits (its [[bin]] in
  # fuzz/Cargo.toml and a row there), not four.
  targets:
    name: read the target list
    # THE SCHEDULE GATE for the whole pass — `deep` and `report` both need this
    # job, so a slot this condition rejects skips all three. FUZZ_SCHEDULE is a
    # JSON array of the cron strings declared above that are to fuzz; unset or
    # empty, only the floor runs.
    #
    # The clause order is load-bearing, because GitHub expressions short-circuit
    # `||`: tag pushes and dispatches pass before the variable is read at all,
    # then the floor passes before fromJSON can reach it. A malformed
    # FUZZ_SCHEDULE therefore reds only the extra slots' firings — visibly, in
    # the run list — while the nightly floor keeps fuzzing.
    if: >-
      github.event_name != 'schedule' ||
      github.event.schedule == '11 21 * * *' ||
      contains(fromJSON(vars.FUZZ_SCHEDULE || '[]'), github.event.schedule)
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read fuzz/targets.txt
        id: read
        run: |
          list=$(awk '!/^[[:space:]]*#/ && NF { printf "%s\"%s\"", (n++ ? "," : ""), $1 }' fuzz/targets.txt)
          [ -n "$list" ] || { echo "no targets in fuzz/targets.txt"; exit 1; }
          echo "list=[$list]" >> "$GITHUB_OUTPUT"
          echo "matrix: [$list]"

  # One leg per target PER ARCH, so a slow target no longer eats the others'
  # budget and the wall time of the pass is one target rather than ten.
  # Throughput spans 1,695x across the tier (990,019 exec/s on `discovery`
  # against 584 on `m2ts`, measured 2026-08-03), which is also why an equal
  # per-target time budget is deliberately an unequal experiment rather than an
  # accident.
  #
  # 15 targets x 2 arches is 30 legs against the Free plan's 20 concurrent jobs,
  # so the last legs QUEUE rather than run — deliberately, and it costs wall
  # time, not runner minutes (which are unmetered on a public repository). The
  # alternative, folding both arches into one leg, was rejected: it would double
  # each leg's wall time anyway AND make the crash-classification path — the one
  # this repository has already had silently disarmed once — read two runs out of
  # one log. This shape leaves every leg's internals exactly as they were.
  deep:
    name: fuzz ${{ matrix.target }} (${{ matrix.arch }})
    needs: [targets]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A job-level block REPLACES the workflow's top-level one rather than adding
    # to it, so `contents: read` is restated here beside the `actions: read`
    # that the artifact fallback below needs to list and download this
    # workflow's own artifacts — without it the checkout loses its token.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
        arch: [x86_64, i686]
        # Neither key exists in the two dimensions above, so each entry decorates
        # every combination of its own arch rather than adding legs.
        include:
          - arch: x86_64
            # Fuzz on the gnu host, NOT the workspace default. The repo's
            # .cargo/config.toml sets build.target = x86_64-unknown-linux-musl (the
            # static-binary build), which cargo-fuzz would otherwise inherit — but
            # libFuzzer's sanitizers are incompatible with a statically linked musl
            # libc and need a musl C++ cross-compiler the runner lacks. The gnu host
            # has the dynamic libc + system C++ that libFuzzer needs.
            triple: x86_64-unknown-linux-gnu
            sanitizer: address
          - arch: i686
            triple: i686-unknown-linux-gnu
            # NO AddressSanitizer at 32 bits, and not by choice: rustc declares
            # i686-unknown-linux-gnu as `"supported-sanitizers":["address"]` while
            # the distributed rust-std for it ships no librustc-*_rt.asan.a, so
            # -Zsanitizer=address compiles and fails at LINK (measured 2026-08-04).
            # Lost with it: -malloc_limit_mb, which hooks the sanitizer's allocator
            # and aborts on one huge allocation. Kept: -timeout and -rss_limit_mb,
            # both of which libFuzzer implements itself. Acceptable because this
            # leg exists for pointer WIDTH — memory safety in a forbid(unsafe)
            # crate is the compiler's job. core.yml's replay leg records the same.
            sanitizer: none
    env:
      # Every value a run step needs, routed through env rather than an
      # expression inside the script (template injection).
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      FUZZ_TARGET: ${{ matrix.triple }}
      SANITIZER: ${{ matrix.sanitizer }}
      # 600 s on a release tag, 300 s nightly. The tag budget is the one place a
      # long run pays: measured 2026-08-03, six of ten targets stop learning
      # inside 250 s, but `m2ts` is still gaining at 843 s and `parse_report`
      # climbs linearly through 900 s with no knee. The old flat 120 s was never
      # justified by a measurement.
      # The `inputs` context is read only under the event that populates it, so
      # a scheduled run never depends on how an absent context resolves.
      FUZZ_SECONDS: ${{ github.event_name == 'push' && '600' || github.event_name == 'workflow_dispatch' && inputs.seconds || '300' }}
      # libFuzzer's own multi-process mode: -jobs is how many fuzzer processes
      # to run in total, -workers how many at a time. Equal values start them
      # all together for the same -max_total_time, so the leg's wall time is
      # unchanged and only its execution count moves. BOTH are set on purpose:
      # given -jobs alone libFuzzer defaults -workers to min(jobs, cores/2),
      # which is 2 on a 4-vCPU runner and leaves half the machine idle.
      # The processes share one corpus directory and libFuzzer's -reload
      # default (1) makes each pick up what the others write.
      # Dispatching with workers=1 gives the single-process arm on the same
      # code path, which is how the comparison in fuzz/README.md was run.
      WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.workers || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pins
        uses: ./.github/actions/pins

      # Nightly + target, the 32-bit C++ toolchain, the build cache, cargo-fuzz
      # and the fuzz lockfile check — the shared body core.yml's replay gate runs
      # too, in .github/actions/fuzz-toolchain.
      - uses: ./.github/actions/fuzz-toolchain
        with:
          target: ${{ matrix.triple }}
          cxx-multilib: ${{ matrix.arch == 'i686' }}
          # Restore-only, and skipped on a tag run: core.yml's replay job owns
          # the save of the cargo-fuzz entry, and restoring an EXECUTABLE is the
          # one place cache poisoning would matter, so a release-adjacent run
          # compiles it instead.
          cargo-fuzz-cache: restore
          # One cache lineage per ARCH, not per leg: within an arch every leg
          # builds the same dependency graph and differs only in which target
          # binary it links, and a per-leg archive of a few hundred MB would churn
          # the repository's 10 GB Actions-cache budget (sweep.yml's shards share
          # a key for the same reason). First finisher saves; the rest skip
          # gracefully. Across arches the artifacts are different triples, so one
          # shared archive would give whichever arch lost the race a miss dressed
          # as a hit.
          cache-shared-key: fuzz-deep-${{ matrix.arch }}
          # Tag runs build fresh: this pass is release-adjacent and must not
          # consume a build cache poisoned elsewhere (zizmor cache-poisoning).
          # Scheduled runs execute on master, where only master-scoped runs can
          # have written the cache they restore.
          cache-lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      # The accumulated corpus: everything earlier runs found that the committed
      # seeds do not already cover. The key carries the run id so every save is a
      # fresh entry (cache entries are immutable), and restore-keys picks the
      # newest entry for this target — the standard rolling-cache shape. Per
      # target AND per arch, so 28 legs cannot clobber each other.
      #
      # BOTH lineages are restored into ONE directory, which is what makes the
      # corpus SHARED rather than forked: a unit is bytes, and bytes that found
      # new coverage at one width are a valid seed at the other. Two restores
      # over the same path union rather than replace (each unpacks a tar into the
      # workspace), and every unit is named by the sha1 of its bytes, so a unit
      # both widths found lands once. Only this leg's own arch is saved back, by
      # the leg that produced it; the two lineages converge on the same content
      # and the cache costs about twice what one arch would — the price of losing
      # nothing, against a design where the newest entry wins and half of each
      # night's discoveries evaporate.
      #
      # The PATH is what the cache's entry version is computed from, so it must
      # stay `fuzz/accumulated/<target>`: putting each arch in a subdirectory
      # would make every pre-arch entry unrestorable and silently reset discovery
      # to the committed seeds — the exact failure the nightly cadence exists to
      # avoid. The bare `fuzz-corpus-<target>-` restore key below is what carries
      # those entries across, and it keeps working afterwards as the fallback for
      # a width that has no entry of its own yet.
      #
      # TRUST MODEL. This entry holds fuzzer INPUT BYTES, never anything
      # executed: libFuzzer feeds each unit to the harness and the harness parses
      # it, which is precisely the operation the whole tier exists to attack. A
      # poisoned unit can therefore only cost time or fail the run — it cannot
      # alter a build. That is why the tag leg may restore it while still
      # refusing the build cache and the cargo-fuzz binary above. The tag leg
      # never SAVES, so a release-adjacent run cannot promote whatever it
      # accumulated into the shared scope; and only master-scoped runs (schedule
      # and dispatch on master) write this key at all, since a pull request's
      # caches are scoped to its own ref and are invisible here.
      - name: Restore the accumulated corpus (64-bit lineage)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/accumulated/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-x86_64-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-x86_64-
            fuzz-corpus-${{ matrix.target }}-

      - name: Restore the accumulated corpus (32-bit lineage)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/accumulated/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-i686-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-i686-

      # THE CACHE'S BACKSTOP, because a cache entry is storage nobody promised:
      # both lineages above can be evicted between passes (the header's cadence
      # note carries the measurement), and every unit in them was also uploaded
      # as a `fuzz-corpus-<target>-<arch>` artifact, which lives 90 days in a
      # store the cache budget does not touch. Runs only when both restores came
      # back empty, and before the seeding step below, so its `restored` count
      # includes whatever this recovers.
      #
      # Queried per artifact NAME, not "the newest run's artifacts": a leg that
      # found nothing new uploads nothing, so the newest run need not carry an
      # artifact for every target and the newest one of a given name may be
      # several passes old. Best-effort throughout — continue-on-error plus a
      # tolerated failure on every call — because an API outage may cost this
      # leg its head start but must never cost the leg.
      #
      # The trust model is the restores' one above, unchanged: these zips hold
      # fuzzer INPUT BYTES that the harness parses, which is the operation the
      # whole tier exists to attack, and only this workflow's own runs write
      # them. Reading them back is therefore no more exposure than the cache is.
      - name: Fall back to the newest corpus artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -z "$(find "fuzz/accumulated/$TARGET" -type f -print -quit 2>/dev/null)" ] || exit 0
          for arch in x86_64 i686; do
            name="fuzz-corpus-$TARGET-$arch"
            id=$(gh api "repos/$GH_REPO/actions/artifacts?name=$name&per_page=5" \
              --jq '[.artifacts[] | select(.expired|not)][0].id' || true)
            [ -n "$id" ] || continue
            mkdir -p "fuzz/accumulated/$TARGET"
            # upload-artifact zips a directory's CONTENTS, so this unpacks flat
            # into the accumulated directory, which is the layout the seeding
            # step and the cache path both expect.
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > corpus-artifact.zip &&
              unzip -oq corpus-artifact.zip -d "fuzz/accumulated/$TARGET" || true
            rm -f corpus-artifact.zip
          done
          echo "$TARGET/$ARCH: $(find "fuzz/accumulated/$TARGET" -type f 2>/dev/null | wc -l) unit(s) recovered from artifacts"

      # THE SEEDS-ONLY BASELINE: how many edges the COMMITTED corpus alone
      # reaches, which is what "edges gained" is measured against in this leg's
      # stats and in the corpus-growth issue below. It has to run HERE, before
      # the seeding step's `cp -n` mixes the accumulated units into
      # fuzz/corpus/<target> — afterwards the two are one directory and the
      # committed half can no longer be measured on its own. Cheap: a -runs=0
      # replay loads the corpus, prints one INITED line and exits, which took
      # 5 s over `codec`'s 7,717 seeds (measured 2026-08-13). Being the job's
      # first `cargo fuzz run` it also absorbs the target's build, so the
      # seconds are all this step adds.
      #
      # An unmeasurable baseline travels as an EMPTY output and is recorded as
      # null, NEVER as 0: a zero baseline would report the leg's entire
      # coverage as a gain, inflating the issue's headline and holding it open
      # on a number nobody measured.
      #
      # The step cannot fail the leg either way. A committed seed that crashes
      # a target is what core.yml's `corpus replay (regression gate, <arch>)`
      # check exists to catch, on every pull request that touches the parser;
      # a crash found while fuzzing files its own issue through the steps below.
      - name: Measure the committed seeds' coverage
        id: baseline
        continue-on-error: true
        env:
          NIGHTLY: ${{ steps.pins.outputs.NIGHTLY }}
        run: |
          seed_cov=""
          seed_ft=""
          if [ -n "$(find "fuzz/corpus/$TARGET" -type f -print -quit 2>/dev/null)" ]; then
            set +e
            cargo +"$NIGHTLY" fuzz run "$TARGET" --target "$FUZZ_TARGET" --sanitizer "$SANITIZER" -- \
              -runs=0 $GUARDS 2>&1 | tee baseline.log
            set -e
            # `#2542 INITED cov: 4065 ft: 17861 corp: 2542/...` — one line, from
            # the one process a replay runs, which is what makes it comparable
            # with the MAX over the workers' DONE lines further down. An
            # unparsed line leaves both values empty.
            seed_cov=$(sed -n 's/.*INITED cov: \([0-9]*\) ft: \([0-9]*\).*/\1/p' baseline.log | head -1)
            seed_ft=$(sed -n 's/.*INITED cov: \([0-9]*\) ft: \([0-9]*\).*/\2/p' baseline.log | head -1)
          fi
          echo "seed_cov=$seed_cov" >> "$GITHUB_OUTPUT"
          echo "seed_ft=$seed_ft" >> "$GITHUB_OUTPUT"
          echo "$TARGET/$ARCH: the committed seeds alone reach ${seed_cov:-(unmeasured)} edge(s), ${seed_ft:-(unmeasured)} feature(s)"

      # What counts as an accumulated unit is decided by CONTENT, not by
      # filename: libFuzzer's merge (which `cargo fuzz cmin` runs) writes every
      # unit it keeps under the sha1 of its bytes, so a committed seed can come
      # back from minimisation under a different name than the one git tracks.
      # Hashing the tracked seeds up front — before anything touches the
      # directory — makes the accounting immune to that.
      - name: Seed the run with the accumulated corpus
        id: seed
        run: |
          mkdir -p "fuzz/accumulated/$TARGET" "fuzz/corpus/$TARGET"
          git ls-files -z -- "fuzz/corpus/$TARGET" | xargs -0 -r sha1sum | cut -c1-40 | sort -u > seed-hashes.txt
          restored=$(find "fuzz/accumulated/$TARGET" -type f | wc -l)
          seeds=$(wc -l < seed-hashes.txt)
          # -n so a name collision can never overwrite a tracked seed; colliding
          # names here mean identical bytes anyway, both being sha1-named.
          find "fuzz/accumulated/$TARGET" -type f -exec cp -n -t "fuzz/corpus/$TARGET/" {} +
          echo "restored=$restored" >> "$GITHUB_OUTPUT"
          echo "seeds=$seeds" >> "$GITHUB_OUTPUT"
          # `seeds` counts distinct seed CONTENTS, which is what the comparison
          # below is against — it reads lower than the tracked file count wherever
          # two committed seeds hold identical bytes.
          echo "$TARGET/$ARCH: $seeds distinct committed seeds + $restored accumulated units"

      # The per-target discovery flags come from fuzz/targets.txt (it documents
      # its own columns); an empty cell there is a measured verdict, not an
      # omission. -dict is resolved to an absolute path because libFuzzer reads
      # it relative to the fuzz binary's own working directory, not this one.
      #
      # A crash must NOT abort the leg here: the steps below still have to
      # minimise the reproducer, quarantine it, and leave the corpus cache in a
      # state tomorrow's run can use. The leg is failed at the end instead.
      # BOTH arches read the flag columns, deliberately: an arch leg running
      # different flags is not the same experiment, and a difference in what it
      # finds would then be unattributable to the width.
      - name: Fresh-fuzz ${{ matrix.target }} (${{ matrix.arch }})
        id: run
        env:
          NIGHTLY: ${{ steps.pins.outputs.NIGHTLY }}
        run: |
          flags=$(awk -v t="$TARGET" -v dir="$PWD/fuzz" '
            !/^[[:space:]]*#/ && $1 == t {
              if ($2 != "-") printf " -dict=%s/%s", dir, $2
              if ($3 != "-") printf " -max_len=%s", $3
            }' fuzz/targets.txt)
          echo "$FUZZ_TARGET (sanitizer=$SANITIZER): budget ${FUZZ_SECONDS}s x ${WORKERS} process(es), guards $GUARDS, flags:${flags:- (none)}"
          set +e
          cargo +"$NIGHTLY" fuzz run "$TARGET" --target "$FUZZ_TARGET" --sanitizer "$SANITIZER" -- \
            -max_total_time="$FUZZ_SECONDS" -jobs="$WORKERS" -workers="$WORKERS" \
            $GUARDS $flags -print_final_stats=1 2>&1 | tee fuzz-parent.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          # WHAT THE CLASSIFIER READS. In multi-process mode the parent does not
          # fuzz: it spawns each worker with its stdout and stderr redirected to
          # fuzz-<N>.log beside the fuzz binary, and copies that whole file to
          # its own stderr as the job exits. So the tee above does carry every
          # worker's panic header, libFuzzer ERROR block and -print_final_stats
          # counters (measured 2026-08-04 on cargo-fuzz 0.13.2 / the pinned
          # nightly; parent rc is still 0 clean / 1 on a crashing job).
          #
          # Read the worker files anyway, for two reasons. The copy is an
          # upstream implementation detail, and the classifier is exactly the
          # path this repository has already had silently disarmed once by an
          # upstream output change; and reading only the files means the
          # per-worker aggregation below cannot count a worker twice. The
          # parent's stream is the fallback for a failure with no worker at all
          # (a build break, a missing toolchain), which writes no fuzz-<N>.log.
          # Only the parent's per-job exit codes are kept from it.
          logs=$(find . -maxdepth 2 -name 'fuzz-[0-9]*.log' | sort)
          if [ -n "$logs" ]; then
            grep -h 'exited with exit code' fuzz-parent.log > fuzz-run.log || true
            # shellcheck disable=SC2086  # one word per worker log, all name-safe
            cat $logs >> fuzz-run.log
          else
            cp fuzz-parent.log fuzz-run.log
          fi
          echo "captured $(echo "$logs" | grep -c .) worker log(s), $(wc -l < fuzz-run.log) lines"
          if [ "$rc" -eq 0 ]; then echo "$TARGET/$ARCH: clean"; else echo "$TARGET/$ARCH: exit $rc"; fi

      # Proof that the leg fuzzed at the width it claims rather than silently
      # falling back to the host: a half-wired arch leg reads as coverage nobody
      # has, which is worse than no arch leg at all.
      - name: Prove the fuzzed binary's pointer width
        if: ${{ !cancelled() }}
        run: |
          bin=$(find "fuzz/target/$FUZZ_TARGET/release" -maxdepth 1 -type f -perm -u+x -name "$TARGET")
          [ -n "$bin" ] || { echo "no $TARGET binary under fuzz/target/$FUZZ_TARGET"; exit 1; }
          file "$bin"
          file "$bin" | grep -q 'ELF 32-bit' && width=32 || width=64
          case "$FUZZ_TARGET" in
            i686-*)   [ "$width" = 32 ] || { echo "expected a 32-bit binary"; exit 1; } ;;
            x86_64-*) [ "$width" = 64 ] || { echo "expected a 64-bit binary"; exit 1; } ;;
          esac
          echo "$TARGET fuzzed a $width-bit binary"

      # libFuzzer writes a crashing input to fuzz/artifacts/, never to the
      # corpus — but a unit ALREADY in the corpus can start crashing after a code
      # change, and that unit would then abort every future run at INITED and
      # freeze discovery on this target forever. So drop any corpus unit whose
      # BYTES match a crash artifact (matching on name would miss a committed
      # seed, which carries a human-readable one). Dropping a committed seed here
      # touches only this checkout; the -runs=0 replay gate is what reports that
      # case, and it reports it on the next pull request either way. The evidence
      # survives in the artifact and the issue. slow-unit-* files are excluded —
      # libFuzzer writes those for a unit that merely approached -timeout, which
      # is not a failure.
      - name: Quarantine the crashing unit
        id: crash
        if: ${{ steps.run.outputs.rc != '0' }}
        env:
          NIGHTLY: ${{ steps.pins.outputs.NIGHTLY }}
        run: |
          repro=$(find fuzz/artifacts -type f ! -name 'slow-unit-*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          find fuzz/artifacts -type f ! -name 'slow-unit-*' -print0 2>/dev/null | xargs -0 -r sha1sum | cut -c1-40 | sort -u > crash-hashes.txt
          find "fuzz/corpus/$TARGET" -type f -print0 | xargs -0 -r sha1sum |
            awk 'NR == FNR { bad[$1] = 1; next } ($1 in bad) { print substr($0, 43) }' crash-hashes.txt - |
            while IFS= read -r f; do rm -f -- "$f"; echo "quarantined $f"; done
          if [ -z "$repro" ]; then
            # No artifact means the run failed before fuzzing (a build break, a
            # missing toolchain); there is nothing to report but the log.
            echo "no crash artifact — the run failed before it fuzzed"
            echo "repro=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reproducer: $repro"
          # tmin is bounded: its default 255 attempts each cost up to -timeout
          # seconds, so a hang would otherwise minimise for over an hour. Five
          # minutes, then keep whatever it had.
          timeout 300 cargo +"$NIGHTLY" fuzz tmin "$TARGET" --target "$FUZZ_TARGET" --sanitizer "$SANITIZER" "$repro" -- $GUARDS || echo "tmin did not finish; keeping the raw reproducer"
          min=$(find "fuzz/artifacts/$TARGET" -maxdepth 1 -type f -name 'minimized-from-*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          [ -n "$min" ] && repro="$min"
          echo "repro=$repro" >> "$GITHUB_OUTPUT"

      # Minimisation policy for the ACCUMULATED corpus (D8 left the committed
      # one alone and handed this one here): minimise the union of the seeds and
      # everything restored, then keep only what is not already tracked. The
      # cache therefore holds units that add a feature the committed seeds do
      # not, which is what bounds its growth; and once a human commits them, the
      # same units become tracked, drop out of the "new" set, and the growth
      # issue closes itself. The committed corpus is never rewritten — the
      # runner's checkout is scratch and nothing is pushed from here.
      #
      # cmin takes the GUARDS and nothing else. Never a per-target flag from
      # targets.txt: -max_len DROPS an over-long unit rather than truncating it,
      # so minimising under the cap would silently strip from the shared corpus
      # exactly the long seeds the other arch's leg still expects to restore.
      - name: Minimise and collect the new units
        id: collect
        if: ${{ !cancelled() }}
        env:
          NIGHTLY: ${{ steps.pins.outputs.NIGHTLY }}
        run: |
          # Every corpus file whose bytes are not in the committed seed set.
          new_units() {
            find "fuzz/corpus/$TARGET" -type f -print0 | xargs -0 -r sha1sum |
              awk 'NR == FNR { seen[$1] = 1; next } !($1 in seen) { print substr($0, 43) }' seed-hashes.txt -
          }
          grown=$(new_units | wc -l)
          cargo +"$NIGHTLY" fuzz cmin "$TARGET" --target "$FUZZ_TARGET" --sanitizer "$SANITIZER" -- $GUARDS || echo "cmin failed; keeping the corpus un-minimised"
          rm -rf "fuzz/accumulated/$TARGET"
          mkdir -p "fuzz/accumulated/$TARGET"
          new_units | while IFS= read -r f; do cp -- "$f" "fuzz/accumulated/$TARGET/"; done
          new=$(find "fuzz/accumulated/$TARGET" -type f | wc -l)
          echo "grown=$grown" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "$TARGET/$ARCH: $grown new units before cmin, $new after"

      - name: Record this leg's numbers
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          RESTORED: ${{ steps.seed.outputs.restored }}
          SEEDS: ${{ steps.seed.outputs.seeds }}
          SEED_COV: ${{ steps.baseline.outputs.seed_cov }}
          SEED_FT: ${{ steps.baseline.outputs.seed_ft }}
          GROWN: ${{ steps.collect.outputs.grown }}
          NEW: ${{ steps.collect.outputs.new }}
          RC: ${{ steps.run.outputs.rc }}
          REPRO: ${{ steps.crash.outputs.repro }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          New-Item -ItemType Directory -Force result | Out-Null
          $log = if (Test-Path fuzz-run.log) { Get-Content -Raw fuzz-run.log } else { '' }
          # One DONE line per worker, each carrying that process's final figures:
          # `#N DONE cov: 1696 ft: 5719 corp: 402/15Mb ... exec/s: 720 ...`.
          # cov and ft are per-process views of a SHARED corpus that -reload
          # keeps in sync, so the highest is the leg's reach; exec/s and the
          # executed-unit count are per process, so their SUM is the leg's
          # throughput — and that sum against the single-process arm is the
          # whole question this parallelism is answering.
          $done = [regex]::Matches($log, '(?m)^#\d+\s+DONE\s+cov:\s*(\d+)\s+ft:\s*(\d+).*?\bexec/s:\s*(\d+)')
          $units = [regex]::Matches($log, '(?m)^stat::number_of_executed_units:\s*(\d+)')
          if ($done.Count -gt 0) {
            $cov = ($done | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Maximum).Maximum
            $ft = ($done | ForEach-Object { [int]$_.Groups[2].Value } | Measure-Object -Maximum).Maximum
            $execs = [int](($done | ForEach-Object { [int]$_.Groups[3].Value } | Measure-Object -Sum).Sum)
          }
          else {
            # A crashing process never reaches its DONE line, so fall back to the
            # last progress line anywhere in the capture. Measured: a run whose
            # every worker panicked prints no DONE at all.
            $cov = if ($log -match '(?s).*\bcov:\s*(\d+)') { [int]$Matches[1] } else { 0 }
            $ft = if ($log -match '(?s).*\bft:\s*(\d+)') { [int]$Matches[1] } else { 0 }
            $execs = if ($log -match '(?s).*\bexec/s:\s*(\d+)') { [int]$Matches[1] } else { 0 }
          }
          # An empty baseline output means the seeds-only replay produced no
          # number, and it stays $null all the way into the issue: 0 would claim
          # the seeds reach nothing and report every edge this leg has as a gain
          # over them. cov_gained pairs the MAX over the workers' DONE lines
          # with a single-process INITED line — both are one process's view of
          # the same shared corpus, which is what makes the subtraction mean
          # anything.
          $seedCov = if ($env:SEED_COV) { [int]$env:SEED_COV } else { $null }
          $seedFt = if ($env:SEED_FT) { [int]$env:SEED_FT } else { $null }
          $covGained = if ($null -ne $seedCov) { $cov - $seedCov } else { $null }
          $stats = [ordered]@{
            target = $env:TARGET
            arch = $env:ARCH
            seconds = [int]$env:FUZZ_SECONDS
            workers = [int]$env:WORKERS
            seeds = [int]$env:SEEDS
            restored = [int]$env:RESTORED
            grown = [int]$env:GROWN
            new = [int]$env:NEW
            seed_cov = $seedCov
            seed_ft = $seedFt
            cov = $cov
            cov_gained = $covGained
            ft = $ft
            execs_per_sec = $execs
            units_executed = [int64](($units | ForEach-Object { [int64]$_.Groups[1].Value } | Measure-Object -Sum).Sum)
            rc = [int]$env:RC
          }
          $stats | ConvertTo-Json | Set-Content result/stats.json
          @(
            "### $($env:TARGET) ($($env:ARCH))"
            ''
            "$($env:SEEDS) distinct committed seeds, $($env:RESTORED) restored, $($env:NEW) new after minimisation - $($env:WORKERS) process(es), cov $cov, ft $ft, $execs exec/s, exit $($env:RC)"
          ) -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $env:REPRO) { exit 0 }

          # The crash's SIGNATURE, not the reproducer's hash, is what one issue
          # is filed per (D3 as amended): tmin is not canonical, so the same bug
          # minimises to different bytes on different nights and a hash key would
          # file a duplicate every time. A panic keys on its source location plus
          # its message with digit runs folded to N — so one out-of-bounds bug
          # does not file an issue per index value, while two different messages
          # at one location still separate. A guard kill carries no panic, so it
          # keys on the target and which guard fired; the reproducer's hash is
          # then only a tiebreaker in the body, because a hash key here would
          # file a fresh issue for every input that hangs the same way.
          # The panic header is matched loosely between the thread name and
          # `panicked at`: current nightly prints a thread id there
          # (`thread '<unnamed>' (2596) panicked at ...`) and older toolchains do
          # not. A tight match silently degrades every panic to the deadly-signal
          # branch below, which would file one issue for all of a target's
          # panics — the exact collapse D3's keying exists to prevent.
          $kind = 'unknown'; $where = ''; $message = ''
          if ($log -match "(?m)^thread '[^']*'.*? panicked at ([^\r\n]+):\r?\n([^\r\n]*)") {
            $kind = 'panic'; $where = $Matches[1].Trim(); $message = $Matches[2].Trim()
          }
          elseif ($log -match 'ERROR: libFuzzer: timeout') { $kind = 'timeout' }
          elseif ($log -match 'ERROR: libFuzzer: out-of-memory') { $kind = 'out-of-memory' }
          elseif ($log -match 'ERROR: libFuzzer: deadly signal') { $kind = 'deadly-signal' }
          $key = if ($kind -eq 'panic') { "panic|$where|$(($message -replace '\d+', 'N'))" } else { "$kind|$($env:TARGET)" }
          $sha = [System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($key))
          $signature = -join ($sha[0..7] | ForEach-Object { $_.ToString('x2') })

          $bytes = [IO.File]::ReadAllBytes($env:REPRO)
          Copy-Item $env:REPRO result/repro.bin
          $crash = [ordered]@{
            target = $env:TARGET
            arch = $env:ARCH
            kind = $kind
            where = $where
            message = $message
            key = $key
            signature = $signature
            repro_name = (Split-Path -Leaf $env:REPRO)
            repro_bytes = $bytes.Length
            repro_sha1 = (Get-FileHash $env:REPRO -Algorithm SHA1).Hash.ToLower()
            # Inlined so the evidence outlives the artifact: artifacts expire
            # after 90 days and a crash issue routinely outlives that wait for
            # its fix, while a tmin'd unit is small enough to paste. Skipped
            # above 16 KiB, which no minimised unit has reached.
            repro_base64 = if ($bytes.Length -le 16384) { [Convert]::ToBase64String($bytes) } else { $null }
            # Anchored on the crash, not on the end of the capture: with several
            # workers concatenated the last lines belong to whichever process
            # finished last, which is usually a clean one. Falls back to the tail
            # when nothing matched, which is the shape a build break leaves.
            log_tail = (& {
              $lines = $log -split "`r?`n"
              $at = ($lines | Select-String -Pattern 'panicked at|ERROR: libFuzzer' | Select-Object -First 1).LineNumber
              if ($at) { $lines[[math]::Max(0, $at - 6) .. [math]::Min($lines.Count - 1, $at + 33)] }
              else { $lines | Select-Object -Last 40 }
            }) -join "`n"
            run_url = $env:RUN_URL
          }
          $crash | ConvertTo-Json | Set-Content result/crash.json
          Write-Host "crash signature $signature ($kind)"

      # Artifact names carry the arch because upload-artifact rejects a second
      # upload under a name the run already used.
      - name: Upload this leg's result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-result-${{ matrix.target }}-${{ matrix.arch }}
          path: result/
          if-no-files-found: ignore

      # The units a human can promote into the committed regression set: unzip
      # into fuzz/corpus/<target>/ and open a pull request. Both arches upload,
      # and a unit found at both widths appears in both — as the SAME file, since
      # cmin names a unit by the sha1 of its bytes, so unzipping both into one
      # directory collapses the duplicate.
      - name: Upload the new corpus units
        if: ${{ !cancelled() && steps.collect.outputs.new != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ matrix.arch }}
          path: fuzz/accumulated/${{ matrix.target }}/
          if-no-files-found: ignore

      # Saved even when the leg failed, and deliberately: a crash must not cost
      # tomorrow's run the corpus (the crashing unit itself was quarantined
      # above). Not saved from a tag run — see the trust model on the restore.
      # Skipped when the minimised difference is empty, because cache/save
      # rejects an empty path; the previous entry then stays, which is correct:
      # its units are still valid discoveries and the next run re-minimises them.
      - name: Save the accumulated corpus
        if: ${{ !cancelled() && github.event_name != 'push' && steps.collect.outputs.new != '0' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/accumulated/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ matrix.arch }}-${{ github.run_id }}

      - name: Fail the leg on a crash
        if: ${{ steps.run.outputs.rc != '0' }}
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          echo "$TARGET/$ARCH exited $RC — see the crash issue and the fuzz-result-$TARGET-$ARCH artifact"
          exit 1

  # One issue per distinct crash signature, plus ONE rolling issue for corpus
  # growth. Modelled on sweep.yml's report job — same `gh label create --force`,
  # same edit-or-create over `gh issue list --json number` — with a different
  # policy, and fanned in rather than filed per leg so two targets that hit the
  # same bug in the same run cannot race each other into two issues.
  #
  # FILING happens on schedule and on tags, not on a plain dispatch: sweep.yml's
  # rule is that a human who pressed the button is already reading the log, and
  # that reason covers dispatch only — a tag push is as unattended as a cron, and
  # a crash on a release tag is the last one that should go unfiled. The
  # file_issues input exists so the filing path itself can be exercised
  # deliberately; an issue-filing path first executed by a real crash at 3 a.m.
  # is an untested path.
  report:
    name: crash + growth issues
    needs: [targets, deep]
    # Keyed on `targets`, because a slot its schedule gate rejects skips the
    # legs too: this job would then find no result artifacts, read that as
    # "the accumulated corpus adds nothing over the committed seeds" and close
    # the rolling growth issue. NOT keyed on `deep` — a night whose legs crash
    # is the night the crash issues matter most.
    if: ${{ !cancelled() && needs.targets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # gh cache delete, for pruning this workflow's own superseded corpus
      # entries (see the prune step).
      actions: write
    steps:
      - name: Download every leg's result
        # No artifacts at all means every leg died before its stats upload; those
        # legs are red already and a second red job would only add noise.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-result-*
          path: results

      - name: File the crash issues and refresh the growth issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the repo
          # from — name it explicitly.
          GH_REPO: ${{ github.repository }}
          FILE_ISSUES: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.file_issues) }}
          SAVES_CORPUS: ${{ github.event_name != 'push' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $stats = @()
          $crashes = @()
          if (Test-Path results) {
            $stats = @(Get-ChildItem results -Recurse -Filter stats.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json })
            $crashes = @(Get-ChildItem results -Recurse -Filter crash.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json })
          }
          # A leg whose seeds-only baseline could not be measured carries $null
          # in seed_cov and cov_gained, and every consumer here has to keep it
          # distinct from 0 — hence the dash in the table and the separate list
          # in the issue rather than a zero that reads as "measured, gained
          # nothing".
          $dash = { param($v) if ($null -eq $v) { '-' } else { $v } }
          $rows = @($stats | Sort-Object target, arch | ForEach-Object {
            "| $($_.target) | $($_.arch) | $($_.seeds) | $($_.restored) | $($_.new) | $(& $dash $_.seed_cov) | $($_.cov) | $(& $dash $_.cov_gained) | $($_.ft) | $($_.execs_per_sec) |"
          })
          # [int] on purpose: Measure-Object sums an empty set to $null, and
          # $null is not 0, so an artifact-less run would otherwise file a
          # growth issue with a blank count.
          $totalNew = [int](($stats | Measure-Object -Property new -Sum).Sum)
          $totalRestored = [int](($stats | Measure-Object -Property restored -Sum).Sum)
          # The legs that reached code the committed seeds do not, which is what
          # the growth issue below keys on. Summed over legs and therefore over
          # both pointer widths — and edges, unlike the units counted above, do
          # not collapse on union: the arches are different binaries, so an edge
          # counted in both is not one edge counted twice.
          $unmeasured = @($stats | Where-Object { $null -eq $_.cov_gained })
          $gainers = @($stats | Where-Object { $_.cov_gained -gt 0 })
          $totalGained = [int](($gainers | Measure-Object -Property cov_gained -Sum).Sum)
          # Counted per leg, so a unit found at both widths counts twice here —
          # the arches share one corpus and cmin names a unit by the sha1 of its
          # bytes, so the duplicate collapses the moment both artifacts are
          # unzipped into one directory. The number is a review-queue signal, not
          # a distinct-unit count.
          # Every leg of a run gets the same FUZZ_SECONDS and WORKERS, so any
          # leg's copy is the whole run's budget. Read from the first because an
          # empty $stats has no leg to read at all.
          $seconds = @($stats).Count ? $stats[0].seconds : 0
          $workers = @($stats).Count ? $stats[0].workers : 0
          @(
            '## Discovery pass'
            ''
            "Budget ${seconds}s per target per arch across $workers concurrent libFuzzer process(es). Accumulated corpus: $totalRestored units in, $totalNew out after minimisation against the committed seeds (summed over both arches, before cross-arch dedup). Those units reach $totalGained edge(s) the committed seeds alone do not."
            ''
            '| target | arch | seeds | restored | new | seed cov | cov | gained | ft | exec/s |'
            '|---|---|---|---|---|---|---|---|---|---|'
            $rows
          ) -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY

          if ($env:FILE_ISSUES -ne 'true') {
            Write-Host "Dispatched run — not filing. Crashes this run: $($crashes.Count); new units: $totalNew; edges gained: $totalGained."
            exit 0
          }

          # --- one issue per distinct crash signature ------------------------
          # Only OPEN issues are matched. A human closes a crash issue with the
          # fix, and a signature that reappears afterwards is a regression that
          # deserves its own issue rather than a reopened one. Nothing here ever
          # closes a crash issue: unlike a red sweep, a crash that stops
          # reproducing is not evidence of a fix — the fuzzer may simply not have
          # replayed that input.
          if ($crashes.Count -gt 0) {
            gh label create fuzz-crash --color b60205 --description 'A fuzz target crashed, hung, or blew its memory guard' --force | Out-Null
          }
          foreach ($group in ($crashes | Group-Object signature)) {
            $c = $group.Group[0]
            # Target AND arch, because a crash that reproduces at only one
            # pointer width is the whole reason this matrix has two: reading
            # "i686 only" off the issue is what tells the reader it is an
            # overflow boundary rather than a parser bug.
            $targets = (@($group.Group | ForEach-Object { "``$($_.target)`` ($($_.arch))" } | Sort-Object -Unique) -join ', ')
            $marker = "<!-- fuzz-signature: $($c.signature) -->"
            $headline = if ($c.kind -eq 'panic') { "$($c.message) at $($c.where)" } else { "$($c.kind) in $($c.target) ($($c.arch))" }
            $title = "fuzz: $headline"
            if ($title.Length -gt 120) { $title = $title.Substring(0, 117) + '...' }
            $repro = if ($c.repro_base64) {
              @(
                'Reproducer (base64, inlined so it outlives the 90-day artifact retention):'
                ''
                '```'
                $c.repro_base64
                '```'
                ''
                '```sh'
                "base64 -d > repro.bin <<'EOF'"
                $c.repro_base64
                'EOF'
                $(if ($c.arch -eq 'i686') {
                  "cargo +nightly fuzz run $($c.target) --target i686-unknown-linux-gnu --sanitizer none repro.bin"
                } else {
                  "cargo +nightly fuzz run $($c.target) repro.bin"
                })
                '```'
              )
            }
            else {
              @("The reproducer is $($c.repro_bytes) bytes — too large to inline; take it from the artifact below.")
            }
            $body = @(
              $marker
              "**Target(s):** $targets"
              "**Kind:** $($c.kind)"
              $(if ($c.where) { "**Where:** ``$($c.where)``" })
              $(if ($c.message) { "**Message:** $($c.message)" })
              "**Reproducer:** ``$($c.repro_name)``, $($c.repro_bytes) bytes, sha1 ``$($c.repro_sha1)`` — artifact ``fuzz-result-$($c.target)-$($c.arch)`` of $env:RUN_URL"
              ''
              $repro
              ''
              '<details><summary>Last 40 lines of the run</summary>'
              ''
              '```'
              $c.log_tail
              '```'
              ''
              '</details>'
              ''
              'This issue is keyed on the crash signature, so the nightly pass refreshes it rather than filing again. Close it with the fix: a later green run is not evidence, because the fuzzer need not have replayed this input.'
            ) | Where-Object { $null -ne $_ }
            $body = ($body -join "`n")
            $existing = gh issue list --state open --label fuzz-crash --limit 200 --json 'number,body' --jq "map(select(.body | contains(`"$marker`"))) | .[0].number"
            if ($existing) {
              gh issue edit $existing --title $title --body $body | Out-Null
              Write-Host "Refreshed issue #$existing ($($c.signature))"
            }
            else {
              gh issue create --title $title --body $body --label fuzz-crash | Out-Null
              Write-Host "Filed a crash issue ($($c.signature))"
            }
          }

          # --- one rolling issue for corpus growth ---------------------------
          # Refreshed by every event that files issues, a release tag included:
          # a tag leg uploads the same `fuzz-corpus-<target>-<arch>` artifact
          # every other leg uploads (that step carries no event condition), so it
          # holds the same promotable units. Declining to SAVE a corpus cache is
          # a separate fact about where those units survive afterwards — it is
          # what the body's wording below keys on — and says nothing about
          # whether there is anything to promote.
          gh label create fuzz-corpus --color 0e8a16 --description 'Fuzz corpus growth awaiting review' --force | Out-Null
          $open = gh issue list --state open --label fuzz-corpus --json number --jq '.[0].number'
          # KEYED ON COVERAGE, NOT ON UNIT COUNT, because a unit count can never
          # reach zero: every pass writes thousands of feature-distinct units of
          # its own, so an issue that fires on units reports tens of thousands
          # after every pass forever — measured 2026-08-13, the first pass after
          # 37,812 units were promoted into the committed seeds reported 28,174
          # against the 28,180 of the night before. The question worth asking a
          # human is whether those units reach code the seeds do not, and a
          # single edge is enough to ask it: a small gain can still be a
          # genuinely new branch.
          #
          # Closing needs every leg to have MEASURED a gain of exactly zero. A
          # leg whose baseline is null proves nothing about absence, and a run
          # that produced no stats at all proves less still, so both hold the
          # issue open. A closed issue is never reopened either — the next pass
          # finds no open `fuzz-corpus` issue and creates a fresh one.
          if (@($stats).Count -gt 0 -and $unmeasured.Count -eq 0 -and @($stats | Where-Object { $_.cov_gained -ne 0 }).Count -eq 0) {
            if ($open) {
              gh issue close $open --comment "Every leg's accumulated units reach exactly the edges the committed seeds already reach: $env:RUN_URL" | Out-Null
              Write-Host "Closed issue #$open"
            }
            exit 0
          }
          if ($gainers.Count -eq 0) {
            Write-Host "No leg gained an edge over the committed seeds, and $($unmeasured.Count) of $(@($stats).Count) leg(s) could not be measured — neither filing nor closing."
            exit 0
          }
          # Sorted by what the reader is deciding on: the legs whose units are
          # worth a promotion pull request sit at the top. The unit count stays
          # a column because it sizes that pull request.
          $grownRows = @($gainers | Sort-Object { [int]$_.cov_gained } -Descending | ForEach-Object {
            "| ``$($_.target)`` | $($_.arch) | $($_.cov_gained) | $($_.seed_cov) | $($_.new) | ``fuzz-corpus-$($_.target)-$($_.arch)`` |"
          })
          # This workflow's push trigger is `tags: ['v*']`, so a push here is
          # always a release tag.
          $trigger = switch ($env:GITHUB_EVENT_NAME) {
            'push' { 'a release tag' }
            'schedule' { 'a scheduled pass' }
            default { 'a manual dispatch' }
          }
          # A tag run saves no corpus cache — a tag-scoped Actions cache entry
          # cannot be restored by the master-scoped runs that would read it — so
          # its units survive only as this run's artifacts and their 90-day
          # retention. Whoever reads this issue after a tag pass has that long.
          $whereTheyLive = if ($env:SAVES_CORPUS -eq 'true') {
            "live in this workflow's per-target, per-arch Actions cache and are re-minimised against the committed seeds on every pass"
          }
          else {
            "live only in this run's artifacts, which expire 90 days after it"
          }
          # Promotion is SELECTIVE, so the recipe names targets rather than
          # globbing `fuzz-corpus-*`: that glob takes every artifact the run
          # uploaded, the units it adds to the committed seeds are permanent,
          # and a low-gain target costs bytes out of all proportion to the code
          # it reaches. Measured
          # 2026-08-13 on the pass that reported 3,907 edges across 14 legs —
          # the four targets whose best leg cleared 150 edges carried 98.3% of
          # that total, while three listed-but-smaller ones would have added
          # 12,022 units for 65 edges between them. The cut below sits in the
          # empty band between those two groups (153 and 30 are its
          # neighbours), so it does not balance on a boundary.
          $promoteCut = 100
          # One entry per TARGET however many of its arches gained: both arch
          # artifacts are wanted, and `fuzz-corpus-<target>-*` asks for both in
          # one pattern.
          $promote = @($gainers | Where-Object { $_.cov_gained -ge $promoteCut } |
            ForEach-Object { $_.target } | Sort-Object -Unique)
          if ($promote.Count -gt 0) {
            $promotePatterns = (($promote | ForEach-Object { "--pattern 'fuzz-corpus-$_-*'" }) -join ' ')
            $promoteLead = "To promote them into the regression set, naming only the $($promote.Count) target(s) whose best leg gained $promoteCut edges or more:"
          }
          else {
            # An empty pattern list would make `gh run download` take every
            # artifact, which is the one thing this block exists to avoid, so
            # the command carries a placeholder instead.
            $promotePatterns = "--pattern 'fuzz-corpus-<target>-*'"
            $promoteLead = "No target's best leg gained $promoteCut edges or more. To promote one anyway, name it:"
          }
          $title = "Fuzz corpus: $totalGained edge(s) beyond the committed seeds"
          $body = @(
            "The discovery pass has accumulated units that reach $totalGained edge(s) the committed seed corpus does not. They $whereTheyLive; nothing is committed automatically."
            ''
            "Refreshed by $trigger, fuzzing ${seconds}s per target per arch across $workers concurrent libFuzzer process(es). A release tag fuzzes 600s where a scheduled pass fuzzes 300, so two refreshes are only comparable with each other when their budgets match."
            ''
            'Each leg measures its own baseline by replaying the committed seeds alone at `-runs=0` before the accumulated units are mixed in, then subtracts that from the coverage the fuzzed corpus reached. The total is summed over both pointer widths, which are different binaries: their edge counts are not the same edges and do not dedupe. The unit counts are summed the same way, but a unit found at both widths is the same bytes under the same sha1 filename, so those DO collapse when both artifacts are unzipped into one directory.'
            ''
            '| target | arch | edges gained | seed cov | units | artifact |'
            '|---|---|---|---|---|---|'
            $grownRows
            $(if ($unmeasured.Count -gt 0) {
              @(
                ''
                "Baseline unmeasured (their gain is unknown, not zero): $((@($unmeasured | ForEach-Object { "``$($_.target)`` ($($_.arch))" } | Sort-Object -Unique) -join ', '))."
              )
            })
            ''
            "Latest run: $env:RUN_URL"
            ''
            $promoteLead
            ''
            '```sh'
            "gh run download $($env:RUN_URL -replace '.*/', '') $promotePatterns --dir /tmp/grown"
            '# then copy each /tmp/grown/fuzz-corpus-<target>-<arch>/* into fuzz/corpus/<target>/ and open a PR'
            '```'
            ''
            "That cut is a guideline for what earns a pull request, not the one-edge condition this issue fires on — add ``--pattern 'fuzz-corpus-<target>-*'`` for any other row above you want. One pattern per target takes both arches, which is the point: unzipping them into one directory collapses the units they share."
            ''
            'This is one rolling issue, edited after every pass. It closes itself once every leg measures a gain of exactly zero — for a target that is not yet saturated, promoting the units above lowers its gain rather than ending it, because the next pass explores onward from what was promoted.'
          ) | Where-Object { $null -ne $_ }
          $body = ($body -join "`n")
          if ($open) {
            gh issue edit $open --title $title --body $body | Out-Null
            Write-Host "Updated issue #$open"
          }
          else {
            gh issue create --title $title --body $body --label fuzz-corpus | Out-Null
            Write-Host 'Filed the corpus-growth issue'
          }

      # Every pass writes one NEW cache entry per target per arch (the key carries
      # the run id, because cache entries are immutable), and a superseded entry
      # is never restored again — restore-keys always picks the newest. Left
      # alone they would sit in the repository's 10 GB store for the full 7-day
      # retention, seven passes deep, evicting caches a pull request needs.
      # Delete every entry but the newest per (target, arch): the run id is the
      # only trailing digit run in the key, so stripping it is what groups them
      # — `fuzz-corpus-m2ts-i686-30865213418` groups as `fuzz-corpus-m2ts-i686`.
      #
      # Master only, and filtered to master's own entries: `gh cache list` sees
      # every ref's caches, so a run dispatched on a branch would otherwise
      # delete the nightly corpus that only master-scoped runs can restore.
      - name: Prune superseded corpus caches
        if: ${{ github.ref == 'refs/heads/master' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $caches = @(gh cache list --key fuzz-corpus- --limit 100 --json 'id,key,createdAt,sizeInBytes,ref' |
            ConvertFrom-Json | Where-Object { $_.ref -eq 'refs/heads/master' })
          $groups = @($caches | Group-Object { $_.key -replace '-\d+$', '' })
          $kept = 0
          foreach ($group in $groups) {
            $ordered = @($group.Group | Sort-Object { [datetime]$_.createdAt } -Descending)
            $kept += $ordered[0].sizeInBytes
            foreach ($stale in ($ordered | Select-Object -Skip 1)) {
              gh cache delete $stale.id | Out-Null
              Write-Host "deleted $($stale.key)"
            }
          }
          Write-Host "kept $([math]::Round($kept / 1MB, 1)) MB of corpus cache across $($groups.Count) target/arch lineage(s)"
