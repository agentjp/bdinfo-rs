name: codeql

# CodeQL static analysis for Rust (build-mode: none — no compilation needed).
# Code scanning is free on public repositories; on a private repo it needs GitHub
# Advanced Security. This workflow assumes a public repo.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily 06:00 UTC — picks up new queries shipped in CodeQL releases.
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # PR-only: rapid sequential squash-merges must each keep their master run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # rust: the crates; actions: the workflow files themselves.
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
