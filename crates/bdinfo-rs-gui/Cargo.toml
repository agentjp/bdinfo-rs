[package]
name = "bdinfo-rs-gui"
# Lock-stepped with the root workspace's version by hand (this independent
# workspace cannot inherit [workspace.package]); the gui-release.yml tag guard
# and the gui-publish.yml crates leg both refuse a gui-v* tag that disagrees.
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "LGPL-2.1-or-later"
authors = ["bdinfo-rs contributors"]
repository = "https://github.com/agentjp/bdinfo-rs"
description = "Native desktop GUI for the bdinfo-rs Blu-ray analyzer (iced, pure-Rust)."
readme = "README.md"
keywords = ["bluray", "bdmv", "m2ts", "gui", "video"]
categories = ["multimedia::video", "gui"]

# Keep the OS-packaging inputs (WiX source, icons, metainfo, license RTF) and
# the CI snapshot pins out of the published crate — `cargo install` builds the
# binary from src/ + assets/; these directories feed only the repo's release
# packaging and snapshot gates.
exclude = ["/packaging", "/snapshots"]

# INDEPENDENT workspace — keeps the large iced/wgpu/winit/cosmic-text dependency
# tree (its runtime graphics deps + unavoidable transitive version duplications)
# OUT of the root workspace's gate, lockfile, and supply-chain audit, exactly like
# crates/bdinfo-rs-wasm and fuzz/. The root Cargo.toml also `exclude`s this dir.
# Unlike the wasm crate this stays INSIDE `forbid(unsafe_code)`: a native iced app
# needs no `unsafe` in our own code (iced/wgpu/winit carry their own internally —
# a dependency concern, not ours).
#
# assets-gen is the dev-side packaging-asset generator (.ico/.icns/hicolor PNGs
# from the same procedural mark): a separate member so its encoder deps (icns,
# png) ride this lockfile — Dependabot and the crate-local cargo-deny cover
# them — while staying OUT of the shipped binary's dependency tree, which the
# no-C tripwire scans per package.
[workspace]
members = [".", "assets-gen"]

[lib]
# A small lib holds the Tier-A view-model (model) + the scan seam (scan) so the
# golden-tie + unit tests link it directly; the bin is the thin iced (Tier-B)
# shell over it, holding no business logic of its own.
name = "bdinfo_rs_gui"
path = "src/lib.rs"

[[bin]]
name = "bdinfo-rs-gui"
path = "src/main.rs"

[dependencies]
# path + version, the same shape as the root [workspace.dependencies] pin, so
# the crate is publishable: cargo strips the path on publish and resolves the
# registry copy from the version alone. Keep lock-stepped with `version` above.
bdinfo-rs-core = { path = "../bdinfo-rs-core", version = "2.0.0" }
# Pure-Rust GUI: wgpu (+ tiny-skia CPU fallback) / cosmic-text / winit. No C.
# `tokio` makes iced's executor a Tokio runtime — the ambient context zbus's
# tokio backend (forced tree-wide by rfd below; cargo features are additive)
# demands from every D-Bus call it drives: rfd's portal dialogs AND iced's own
# mundy theme stream, which asks for zbus/async-io but gets the tokio backend.
# Without it the default thread-pool executor's `enter` is a no-op and any
# Linux portal call panics at boot (Halloy ships this exact iced+rfd pairing).
iced = { version = "0.14", features = ["tokio"] }
# The folder picker, on its pure-Rust `xdg-portal` backend — NOT the `gtk3`
# backend, which links C (gtk-sys/glib-sys/gdk-sys via pkg-config). `xdg-portal`
# reaches the desktop's file chooser over D-Bus (ashpd/zbus, pollster) on Linux,
# and uses the OS dialog (windows-sys / objc) on Windows/macOS — no C linked. The
# no-C gate (`cargo tree --target all`) asserts no GTK crate ever appears.
# `xdg-portal` needs one async runtime to drive ashpd: `tokio` (pure Rust,
# maintained), not the default `async-std` (deprecated upstream) — without one
# the Linux target does not compile at all (Halloy ships this exact pair).
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
# The `log` FACADE only (pure Rust, ~no code): the iced/wgpu/rfd tree already
# routes its diagnostics through it — iced_wgpu logs the selected adapter, rfd
# logs the portal errors it swallows — so it was in this lockfile long before
# this direct entry, which just lets our own code (and the hand-rolled std
# sink in `diagnostics`) speak the same facade. No sink crate (fern/tracing):
# the sink is ~40 lines of std.
log = "0.4"

[dev-dependencies]
# Drive the real `view()` headlessly — click by text, drain the messages back
# through `update` — and pin key states as tiny-skia RGBA snapshot hashes: the
# Tier-B verification layer (Posture C's analogue of the wasm crate's
# multi-runtime parity).
iced_test = "0.14"
# Amplify the Tier-A unit tests with property tests, like the wasm crate does.
proptest = "1"

# cargo-deb metadata (mirroring the CLI's, adapted to a desktop app). The
# release lane builds NATIVELY per arch and packages with --no-build, so the
# plain target/release asset paths hold and `$auto` resolves the glibc depends
# from the binary itself via dpkg-shlibdeps. The recommends are runtime-only
# couplings no shlibdeps scan can see: rfd's file dialogs go through the XDG
# desktop portal (without a portal + backend the pickers silently fail), and
# wgpu dlopens the Vulkan loader (without it iced falls back to tiny-skia
# software rendering). No config file is packaged: gui.conf is per-user runtime
# data the app creates, left untouched on uninstall. The icons install under the
# AppStream id rather than their source name, which is what the desktop file's
# Icon= key names.
[package.metadata.deb]
maintainer = "bdinfo-rs contributors <bdinfo-rs@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "xdg-desktop-portal, xdg-desktop-portal-gtk | xdg-desktop-portal-kde, libvulkan1"
extended-description = "Native desktop GUI for bdinfo-rs, the memory-safe Blu-ray disc analyzer. Opens BDMV folders and .iso images, runs the measured scan with live progress, and renders the classic BDInfo per-stream video/audio report — byte-identical to the bdinfo-rs command-line tool."
assets = [
    ["target/release/bdinfo-rs-gui", "usr/bin/", "755"],
    ["packaging/copyright", "usr/share/doc/bdinfo-rs-gui/copyright", "644"],
    ["packaging/io.github.agentjp.bdinfo-rs.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.agentjp.bdinfo-rs.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/icons/hicolor/16x16/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/16x16/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/24x24/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/24x24/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/32x32/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/32x32/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/48x48/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/48x48/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/64x64/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/64x64/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/128x128/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/128x128/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/256x256/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/256x256/apps/io.github.agentjp.bdinfo-rs.png", "644"],
    ["packaging/icons/hicolor/512x512/apps/bdinfo-rs-gui.png", "usr/share/icons/hicolor/512x512/apps/io.github.agentjp.bdinfo-rs.png", "644"],
]

# cargo-generate-rpm (same asset set). auto-req scans the binary's dynamic
# needs for the glibc requires, mirroring the deb's $auto — valid because the
# rpm legs also package natively per arch.
[package.metadata.generate-rpm]
auto-req = "auto"
assets = [
    { source = "target/release/bdinfo-rs-gui", dest = "/usr/bin/bdinfo-rs-gui", mode = "755" },
    { source = "packaging/io.github.agentjp.bdinfo-rs.desktop", dest = "/usr/share/applications/io.github.agentjp.bdinfo-rs.desktop", mode = "644" },
    { source = "packaging/io.github.agentjp.bdinfo-rs.metainfo.xml", dest = "/usr/share/metainfo/io.github.agentjp.bdinfo-rs.metainfo.xml", mode = "644" },
    { source = "packaging/icons/hicolor/16x16/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/24x24/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/32x32/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/48x48/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/64x64/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/128x128/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/256x256/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
    { source = "packaging/icons/hicolor/512x512/apps/bdinfo-rs-gui.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.agentjp.bdinfo-rs.png", mode = "644" },
]

# The portal + Vulkan runtime couplings, as weak deps (see the deb recommends;
# rpm boolean alternation is skipped — GNOME/KDE installs carry their backend).
[package.metadata.generate-rpm.recommends]
xdg-desktop-portal = "*"
vulkan-loader = "*"

# Size-tuned, mirroring the CLI's shipped binary + the wasm crate's profile.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Maximal-FEASIBLE strictness (Posture C, mirroring the wasm crate's Posture B) —
# but this crate KEEPS `forbid(unsafe_code)`: a native iced app needs no `unsafe`
# in our own code. Everywhere else it is held to the core's posture: clippy
# all/pedantic/nursery/cargo + the core's hostile-input restriction picks, with a
# SHORT allow-list for the lints intrinsic to a GUI leaf, not bugs. Declared at
# the workspace level so assets-gen inherits the identical posture.
[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid" # memory safety is the product guarantee — no unsafe here.
# `cargo llvm-cov` sets cfg(coverage)/cfg(coverage_nightly) when instrumenting;
# register them so the `#[cfg_attr(coverage_nightly, …)]` coverage-exclusion
# attributes in `volume` don't trip `unexpected_cfgs` under the `-D warnings`
# gate (mirrors the root workspace's declaration).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Restriction picks — the same bug classes the core guards: out-of-bounds index
# panics, UTF-8 slice panics, silent wrap on byte/offset math, and panics.
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unwrap_used = "deny"
panic = "deny"

# ── allow-list: each is intrinsic to an iced GUI leaf, not a bug ──
# The iced/wgpu/winit tree carries duplicate versions of low-level crates that no
# leaf can dedupe (design-review §2.2), so dup-detection is noise here.
multiple_crate_versions = "allow"
# The view-model lives in a `model` module and the scan seam in `scan`; names like
# `model::PlaylistRow` / `scan::ScanData` read naturally and renaming to dodge the
# prefix would be worse (the core workspace allows this lint for the same reason).
module_name_repetitions = "allow"
