# cargo-mutants policy for the native GUI crate (its own workspace; the root
# .cargo/mutants.toml is NOT inherited). Posture C, tiered like the wasm crate's
# Posture B:
#
# Tier A — the LIBRARY (args / flow / model / selection / panes / progress /
# paths / clipboard / columns / settings / theme / icon / winres / scan) — is
# held to 0 missed.
# Every mutant faces the whole suite: the unit + property tests, the golden-tie
# parity tests (byte-exact reports over the committed fixture), and the
# iced_test interaction + snapshot-hash tests in the binary (run the gate with
# ICED_TEST_BACKEND=tiny-skia, as scripts/gui-compliance.ps1 and gui.yml do, so
# the pixel ties participate — a palette or view-model mutation shifts the
# rendered hash).
#
# Tier B — the two binary-only files — is excluded BY FILE, each with its proof:
#
#   src/main.rs  The iced shell: update/view/subscriptions, the rfd dialogs,
#                the worker thread + channel, the window runtime. Environment-
#                bound (display, dialogs, threads, the OS event loop) — a
#                mutant here needs a running window to observe. Verified
#                instead by the iced_test Simulator suite (which drives view →
#                messages → update and asserts the Tier-A state), the snapshot
#                hashes, the golden ties, and the headless launch smoke in CI.
#
#   src/ui.rs    The widget style vocabulary (Palette -> iced Style closures)
#                and layout constants. Pure presentation whose only observable
#                output is pixels: it is pinned byte-exactly by the tiny-skia
#                snapshot hashes (any colour/border/spacing mutation shifts the
#                rendered RGBA buffer), which is the Posture-B "byte-exact
#                parity instead of line-level mutation" argument applied to
#                pixels. Per-field unit assertions would restate every token
#                twice without adding signal.
#
#   build.rs     The icon-embedding build script: env-bound glue (target
#                cfg vars, OUT_DIR, cargo directives, the linker handoff) a
#                test cannot observe without running a full cargo build. All
#                its logic lives in src/icon.rs + src/winres.rs (Tier A,
#                mutation-covered, incl. a pinned checksum of the exact .res
#                it writes); the handoff itself is verified by the Windows CI
#                builds linking the resource.
#
#   assets-gen/src/main.rs
#                The packaging-asset regeneration entry point: filesystem glue
#                (create_dir_all + write into packaging/) over the pure
#                assets() the tie test byte-compares against the committed
#                files — a mutant here could only mis-write files the tie
#                test does not re-read.
exclude_globs = ["src/main.rs", "src/ui.rs", "build.rs", "assets-gen/src/main.rs"]

# No `exclude_re`: every Tier-A mutant in this crate is killable. The raw
# volume-device reads that need an adjudication live in `bdinfo-rs-core`
# (`vfs::volume`) and are excluded by that workspace's own policy.

# Enforce the committed lockfile on every mutant build (mirrors CI).
additional_cargo_args = ["--locked"]
